name: Point4 FT11 Contract 37 Acceptance Cleanup V3 Gate
on:
  push:
    branches: [ beta56-offline-ownership-consolidation ]
    paths:
      - 'supabase-point4-ft11-acceptance-cleanup-v3-guard.sql'
      - 'scripts/check-point4-ft11-acceptance-cleanup-v3.js'
      - 'evidence/point4-runtime-recovery-2026-09-22/**'
      - '.github/workflows/point4-ft11-acceptance-cleanup-v3.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Semantic gate
        run: node scripts/check-point4-ft11-acceptance-cleanup-v3.js
      - name: PostgreSQL 16 CREATE and effective read-back
        run: |
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('supabase-point4-ft11-acceptance-cleanup-v3-guard.sql').read_text()
          tables=sorted(set(re.findall(r'public\.([a-zA-Z0-9_]+)',s)))
          skip={'inventory_stock_assert_legacy_write_allowed_v2','sharawla_acceptance_scan_v3'}
          defs={
          'employees':'auth_user_id uuid,active boolean','retail_inventory_movements':'branch_id bigint,product_id bigint,quantity_delta numeric,client_tx_id text','pharmacy_batches':'id bigint,batch_no text,quantity numeric',
          'returns':'id bigint,client_tx_id text','orders':'id bigint,client_tx_id text,customer_id bigint','logistics_shipments_v1':'id bigint,client_tx_id text,client_customer_id bigint','logistics_client_settlements_v1':'id bigint,client_tx_id text,client_customer_id bigint',
          'membership_members_v1':'id bigint,notes text,customer_id bigint','membership_subscriptions_v1':'id bigint,client_tx_id text,member_id bigint','membership_classes_v1':'id bigint,name text',
          'service_jobs_v1':'id bigint,client_tx_id text,customer_id bigint','service_appointments_v1':'id bigint,client_tx_id text,customer_id bigint','service_customer_packages_v1':'id bigint,client_tx_id text,customer_id bigint',
          'retail_purchase_orders':'id bigint,client_tx_id text','retail_goods_receipts':'id bigint,client_tx_id text','retail_supplier_returns':'id bigint,client_tx_id text',
          'pharmacy_prescriptions':'id bigint,notes text','pharmacy_insurance_companies':'id bigint,code text','customers':'id bigint,notes text',
          'logistics_client_settlement_items_v1':'settlement_id bigint,shipment_id bigint','logistics_cod_events_v1':'shipment_id bigint,client_tx_id text','logistics_returns_v1':'shipment_id bigint','logistics_pickup_requests_v1':'client_tx_id text,client_customer_id bigint',
          'membership_bookings_v1':'member_id bigint,class_id bigint,client_tx_id text','membership_checkins_v1':'member_id bigint,subscription_id bigint,client_tx_id text','membership_renewal_events_v1':'subscription_id bigint,client_tx_id text','membership_freezes_v1':'subscription_id bigint','membership_plans_v1':'code text',
          'service_package_usage_v1':'customer_package_id bigint,job_id bigint,appointment_id bigint,client_tx_id text','service_installations_v1':'job_id bigint','service_job_parts_v1':'job_id bigint','service_warranties_v1':'customer_id bigint,terms text','service_assets_v1':'customer_id bigint,metadata jsonb','service_packages_v1':'code text','service_catalog':'code text',
          'pharmacy_prescription_items':'prescription_id bigint','pharmacy_order_batch_allocations':'batch_id bigint,order_id bigint','pharmacy_insurance_plans':'company_id bigint,code text',
          'retail_supplier_return_items':'supplier_return_id bigint','retail_goods_receipt_items':'goods_receipt_id bigint','retail_purchase_workflow_events':'entity_type text,entity_id bigint','retail_purchase_order_items':'purchase_order_id bigint',
          'return_payments':'return_id bigint','return_items':'return_id bigint','order_items':'id bigint,order_id bigint','order_item_modifiers':'order_item_id bigint','order_payments':'order_id bigint','expenses':'client_tx_id text','offline_v2_server_receipts':'client_tx_id text'}
          with open('/tmp/h.sql','w') as f:
            f.write("create schema auth; create function auth.uid() returns uuid language sql as $$select null::uuid$$;\n")
            for t in tables:
              if t not in skip:f.write(f"create table if not exists public.{t}({defs.get(t,'id bigint')});\n")
            f.write("create function public.inventory_stock_assert_legacy_write_allowed_v2(bigint,text,bigint) returns void language plpgsql as $$begin return;end$$;\n")
            f.write("create function public.sharawla_acceptance_scan_v3(text) returns jsonb language sql as $$select '{\"total\":0}'::jsonb$$;\n")
          PY
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/h.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase-point4-ft11-acceptance-cleanup-v3-guard.sql
          psql -h localhost -U postgres -d postgres -Atc "select pg_get_functiondef('public.sharawla_acceptance_cleanup_v3(text)'::regprocedure)" >/tmp/effective.sql
          grep -q "inventory_stock_assert_legacy_write_allowed_v2" /tmp/effective.sql
          grep -q "v_ownership" /tmp/effective.sql
          grep -q "retail_purchase_workflow_events" /tmp/effective.sql
          echo "POINT4_FT11_37_POSTGRES_PASS create=1 readback=1 guard=1 frozen_products=1 v3_purchasing=1"
