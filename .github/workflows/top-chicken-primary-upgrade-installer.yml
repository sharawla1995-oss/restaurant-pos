name: Top Chicken primary in-place Windows update candidate
on:
  push:
    branches: [release/top-chicken-sh0008-primary-v10.5.19-candidate]
    paths:
      - 'app.js'
      - 'main.js'
      - 'package.json'
      - 'version.json'
      - 'index.html'
      - 'sw.js'
      - 'update-config.json'
      - 'top-chicken-update-channel.js'
      - 'top-chicken-updates/sh0008.json'
      - 'tests/top-chicken/primary-*.cjs'
      - 'tests/top-chicken/top-chicken-update-channel.cjs'
      - 'tests/top-chicken/login-edge-route-regression.cjs'
      - '.github/workflows/top-chicken-primary-upgrade-installer.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: top-chicken-sh0008-primary-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-real-inplace-upgrade:
    if: github.ref == 'refs/heads/release/top-chicken-sh0008-primary-v10.5.19-candidate'
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Initialize disposable Windows installer target
        shell: pwsh
        run: |
          "TC_PRIMARY_INSTALL_DIR=$env:RUNNER_TEMP\TC-PRIMARY-INPLACE-ACCEPTANCE" >> $env:GITHUB_ENV
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Install source build dependencies
        run: npm install --no-audit --no-fund
      - name: Verify food/inventory official baseline and TC scoped source
        run: |
          npm run check
          node tests/top-chicken/primary-base-port-check.cjs
          node tests/top-chicken/login-edge-route-regression.cjs
          node --check main.js
      - name: Ensure official installer identity is unchanged, stable releases not published
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.name -ne 'sharawla-pos-windows' -or $pkg.build.appId -ne 'com.topburger.pos' -or $pkg.build.productName -ne 'Sharawla POS') { throw 'Not an in-place main POS update' }
          if ($pkg.version -ne '10.5.19-rc.2') { throw 'Candidate version drift' }
          $updates = Get-Content update-config.json -Raw | ConvertFrom-Json
          if (-not $updates.enabled -or $updates.channel -ne 'top-chicken-sh0008') { throw 'Dedicated TC channel required; general latest forbidden' }
      - name: Verify tenant-scoped update selector
        run: node tests/top-chicken/top-chicken-update-channel.cjs
      - name: Build primary Windows x64 installer locally in CI (NO publish)
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Verify actual packaged Windows executable and record SHA256
        run: node tests/top-chicken/primary-installer-package-check.cjs
      - name: Download actual original 10.5.15 installer with SHA verification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force .original-10-5-15 | Out-Null
          gh release download v10.5.15 --repo ${{ github.repository }} --pattern 'Sharawla-POS-Setup-10.5.15-x64.exe' --dir .original-10-5-15
          gh release download v10.5.15 --repo ${{ github.repository }} --pattern 'production-v10.5.15-sha256.txt' --dir .original-10-5-15
          if ($LASTEXITCODE -ne 0) { throw 'Cannot retrieve original release' }
          $old = '.original-10-5-15/Sharawla-POS-Setup-10.5.15-x64.exe'
          $got = (Get-FileHash $old -Algorithm SHA256).Hash.ToLower()
          $expected = (Get-Content .original-10-5-15/production-v10.5.15-sha256.txt -Raw).ToLower()
          if (-not $expected.Contains($got)) { throw 'Original 10.5.15 release digest mismatch' }
          'Verified official v10.5.15 x64 sha256: '+$got
      - name: Install the original 10.5.15 main POS on disposable Windows only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = $env:TC_PRIMARY_INSTALL_DIR
          if (Test-Path $target) { throw 'Disposable target must be empty' }
          $old = (Resolve-Path '.original-10-5-15/Sharawla-POS-Setup-10.5.15-x64.exe').Path
          $proc = Start-Process $old -ArgumentList @('/S', "/D=$target") -PassThru
          if (-not $proc.WaitForExit(180000)) { throw 'Old installer timed out' }
          if ($proc.ExitCode -ne 0) { throw "Original installer exit: $($proc.ExitCode)" }
          if (-not (Test-Path (Join-Path $target 'Sharawla POS.exe'))) { throw 'Official POS executable missing' }
      - name: Install test-only Playwright runner
        run: npm install --no-save --no-package-lock playwright@1.58.2
      - name: Open official 10.5.15 and seed local synthetic SQLite test record
        run: node tests/top-chicken/primary-install-upgrade-smoke.cjs before
      - name: Upgrade IN PLACE to Top Chicken primary 10.5.19-rc.2 on disposable Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Get-ChildItem dist -Filter 'Top-Chicken-SH0008-Primary-*.exe' | Select-Object -First 1
          if (-not $candidate) { throw 'Main candidate installer missing' }
          $proc = Start-Process $candidate.FullName -ArgumentList @('/S', "/D=$env:TC_PRIMARY_INSTALL_DIR") -PassThru
          if (-not $proc.WaitForExit(180000)) { throw 'Candidate upgrade timed out' }
          if ($proc.ExitCode -ne 0) { throw "Candidate installer exit: $($proc.ExitCode)" }
          if (-not (Test-Path (Join-Path $env:TC_PRIMARY_INSTALL_DIR 'Sharawla POS.exe'))) { throw 'Main POS executable not retained' }
      - name: Full exit and new launch proves version and local SQLite survived upgrade
        run: node tests/top-chicken/primary-install-upgrade-smoke.cjs after
      - name: Upload installable primary candidate and evidence (not stable release)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: top-chicken-SH0008-primary-10.5.19-rc.2-${{ github.sha }}
          retention-days: 30
          path: |
            dist/Top-Chicken-SH0008-Primary-*.exe
            evidence/top-chicken/primary-*.json
