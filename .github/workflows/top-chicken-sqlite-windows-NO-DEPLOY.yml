name: Top Chicken SQLite Windows installer and in-place safety (NO DEPLOY)
on:
  push:
    branches: [codex/top-chicken-sh0008-sqlite-durability-20261017]
    paths:
      - 'main.js'
      - 'top-chicken-sqlite-durability.js'
      - 'tests/top-chicken/sqlite-windows-inplace-smoke.cjs'
      - '.github/workflows/top-chicken-sqlite-windows-NO-DEPLOY.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: top-chicken-sqlite-disposable-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  disposable-windows-inplace:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      TOP_CHICKEN_PRIMARY_CI_NO_NETWORK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare disposable fixed target directory
        shell: pwsh
        run: |
          "TC_SQLITE_TEST_INSTALL_DIR=$env:RUNNER_TEMP\TC-SQLITE-INPLACE-TEST" >> $env:GITHUB_ENV
          if (Test-Path "$env:RUNNER_TEMP\TC-SQLITE-INPLACE-TEST") { throw 'Disposable test install dir unexpectedly already exists' }
      - name: Install build and test dependencies locally on CI
        run: npm install --no-audit --no-fund
      - name: Validate sources and isolated SQLite durability assertions
        run: |
          node --check main.js
          node --check top-chicken-sqlite-durability.js
          node --check tests/top-chicken/sqlite-windows-inplace-smoke.cjs
          node tests/top-chicken/sqlite-durability-regression.cjs
      - name: Build x64 Windows NSIS installer WITHOUT publishing
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Verify reviewed SQLite writer is physically in app.asar
        shell: node {0}
        run: |
          const fs=require('fs'),path=require('path'),crypto=require('crypto'),assert=require('assert/strict');
          const asar=require('asar');
          const archive=path.join('dist','win-unpacked','resources','app.asar');
          assert.ok(fs.existsSync(archive));
          for(const file of ['main.js','top-chicken-sqlite-durability.js','preload.js']){
            assert.deepEqual(asar.extractFile(archive,file),fs.readFileSync(file),file+' must match reviewed source');
          }
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const packed=JSON.parse(asar.extractFile(archive,'package.json').toString());
          assert.equal(pkg.version,'10.5.19-rc.9');
          assert.equal(packed.version,pkg.version);
          assert.equal(pkg.build.appId,'com.topburger.pos');
          assert.equal(pkg.name,'sharawla-pos-windows');
          const candidates=fs.readdirSync('dist').filter(n=>/^Top-Chicken-SH0008-Primary-10\.5\.19-rc\.9-x64\.exe$/.test(n));
          assert.equal(candidates.length,1,'exact reviewed installer name');
          const exe=path.join('dist',candidates[0]);
          fs.mkdirSync(path.join('evidence','top-chicken'),{recursive:true});
          const info={result:'PASS',scope:'DISPOSABLE CI ONLY - NOT APPROVED TO INSTALL',commit:process.env.GITHUB_SHA,installer:candidates[0],bytes:fs.statSync(exe).size,sha256:crypto.createHash('sha256').update(fs.readFileSync(exe)).digest('hex')};
          fs.writeFileSync('evidence/top-chicken/sqlite-installer.json',JSON.stringify(info,null,2));
          console.log(JSON.stringify(info));
      - name: Retrieve pinned existing RC9 installer artifact, verified SHA256
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh run download 38675218014 --repo ${{ github.repository }} --name 'TC-SH0008-rc9-DO-NOT-INSTALL-cloud-approval-pending-07b2adcfccb687b7d76006fa5c994535ce7c4c84' --dir .tc-pinned-previous
          if ($LASTEXITCODE -ne 0) { throw 'Pinned previous RC9 artifact unavailable' }
          $matches=@(Get-ChildItem -LiteralPath .tc-pinned-previous -Recurse -File -Filter 'Top-Chicken-SH0008-Primary-10.5.19-rc.9.exe')
          if ($matches.Count -ne 1) { throw 'Expected exactly one pinned existing RC9 installer' }
          $actual=(Get-FileHash -LiteralPath $matches[0].FullName -Algorithm SHA256).Hash.ToLower()
          $expected='f82a63ea6509aadf36855330a974f8633d8dbcaa9de86b461c4bc0c4a9a4c927'
          if ($actual -ne $expected) { throw "Pinned previous installer digest mismatch: $actual" }
          "TC_SQLITE_ORIGINAL_EXE=$($matches[0].FullName)" >> $env:GITHUB_ENV
          Write-Host "PINNED_RC9_SHA256_OK $actual"
      - name: Install previously approved RC9 build onto disposable Windows only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=$env:TC_SQLITE_ORIGINAL_EXE
          $proc=Start-Process -FilePath $exe -ArgumentList @('/S',"/D=$env:TC_SQLITE_TEST_INSTALL_DIR") -PassThru
          if (-not $proc.WaitForExit(180000)) { Stop-Process -Id $proc.Id -Force; throw 'Legacy installer timed out' }
          if ($proc.ExitCode -ne 0) { throw "Legacy installer exited $($proc.ExitCode)" }
          if (!(Test-Path -LiteralPath (Join-Path $env:TC_SQLITE_TEST_INSTALL_DIR 'Sharawla POS.exe'))) { throw 'Original executable missing' }
      - name: Install test-only Playwright runner
        run: npm install --no-save --no-package-lock playwright@1.58.2
      - name: Open ORIGINAL RC9 and preserve synthetic old order and KV
        run: node tests/top-chicken/sqlite-windows-inplace-smoke.cjs before
      - name: Replace ORIGINAL installer in place with patched candidate on CI only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $candidate=(Get-Item 'dist\Top-Chicken-SH0008-Primary-10.5.19-rc.9-x64.exe').FullName
          $proc=Start-Process -FilePath $candidate -ArgumentList @('/S',"/D=$env:TC_SQLITE_TEST_INSTALL_DIR") -PassThru
          if (-not $proc.WaitForExit(180000)) { Stop-Process -Id $proc.Id -Force; throw 'Candidate installer timed out' }
          if ($proc.ExitCode -ne 0) { throw "Candidate installer exited $($proc.ExitCode)" }
          if (!(Test-Path -LiteralPath (Join-Path $env:TC_SQLITE_TEST_INSTALL_DIR 'Sharawla POS.exe'))) { throw 'Candidate executable missing' }
      - name: Launch patched EXE; ensure persistent KV, queued order, restart and corrupt-main fail-closed
        run: node tests/top-chicken/sqlite-windows-inplace-smoke.cjs after
      - name: Never release, update feed, install on owner device or contact Supabase
        run: echo "NO DEPLOY - disposable Windows x64 synthetic data only; artifact is NOT APPROVED TO INSTALL."
      - name: Upload experimental Windows artifact and test report ONLY
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TC-SH0008-SQLITE-DURABILITY-DO-NOT-INSTALL-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            dist/Top-Chicken-SH0008-Primary-10.5.19-rc.9-x64.exe
            evidence/top-chicken/sqlite-*.json
