name: Beta46 Universal Owner Diagnostics Check

on:
  push:
    branches:
      - beta46-universal-owner-diagnostics
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '16'
      - name: Syntax check universal diagnostics
        run: node --check owner-diagnostics-universal-v2.js
      - name: Run existing source gates
        run: npm run check
