name: Point4 Batch10 Supply Fixture Semantic and PostgreSQL Compile Gate
on:
  push:
    branches: [ beta56-offline-ownership-consolidation ]
    paths:
      - 'supabase-beta55-acceptance-supply.sql'
      - 'scripts/check-point4-batch10-supply-fixture.js'
      - '.github/workflows/point4-batch10-postgres-compile.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - name: Assert isolation
        run: echo "No Supabase/Beta/Production credentials are used by this workflow."
      - name: Semantic
        run: node scripts/check-point4-batch10-supply-fixture.js
      - name: Build compile stubs
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create schema auth;
          create function auth.uid() returns uuid language sql as $$select '00000000-0000-0000-0000-000000000001'::uuid$$;
          create function public.is_admin() returns boolean language sql as $$select true$$;
          create function public.current_employee_id() returns bigint language sql as $$select 1::bigint$$;
          create function public.inventory_stock_assert_legacy_write_allowed_v2(bigint,text,bigint) returns void language plpgsql as $$begin return; end$$;
          create function public.sharawla_beta55_supply_acceptance_cleanup_v1(text) returns jsonb language sql as $$select jsonb_build_object('residue',0)$$;
          create sequence public.branches_id_seq; create sequence public.products_id_seq;
          create table public.branches(id bigint,name text,active boolean,website_visible boolean,website_orders_enabled boolean,location_type text,location_code text);
          create table public.products(id bigint,name text,price numeric,cost numeric,barcode text,active boolean,website_visible boolean);
          create table public.retail_inventory_balances(branch_id bigint,product_id bigint,quantity numeric,track_inventory boolean,average_unit_cost numeric,last_purchase_cost numeric,updated_at timestamptz,unique(branch_id,product_id));
          create table public.inventory_supply_routes(id bigserial,source_location_id bigint,destination_branch_id bigint,active boolean,lead_time_days int,allow_emergency boolean,notes text,created_by_employee_id bigint);
          create table public.inventory_supply_catalog(id bigserial,route_id bigint,item_type text,product_id bigint,request_unit_code text,min_request_qty numeric,max_request_qty numeric,request_multiple numeric,suggested_target_qty numeric,reorder_min_qty numeric,target_stock_qty numeric,active boolean,sort_order int,notes text);
          SQL
      - name: Compile fixture
        run: |
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('supabase-beta55-acceptance-supply.sql').read_text()
          m=re.search(r'(?is)(create or replace function\s+public\.sharawla_beta55_supply_acceptance_fixture_v1\s*\(.*?end\s*\$\$;)',s)
          assert m, 'fixture definition missing'
          pathlib.Path('/tmp/b10.sql').write_text(m.group(1))
          print('EXTRACT_COMPLETE functions=1')
          PY
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/b10.sql
          echo "POSTGRES_CREATE_PASS functions=1"
      - name: Verify effective definition
        run: |
          test "$(psql -h localhost -U postgres -d postgres -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='sharawla_beta55_supply_acceptance_fixture_v1'")" = "1"
          echo "PG_FUNCTIONS_EXIST=1"
