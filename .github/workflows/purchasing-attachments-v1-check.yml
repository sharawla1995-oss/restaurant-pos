name: Purchasing Attachments V1 Check

on:
  push:
    branches:
      - beta54-purchasing-attachments
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '16'
      - name: Verify source gates
        run: npm run check
