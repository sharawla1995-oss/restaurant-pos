name: V10.5.10 Stable Immutable Guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify immutable v10.5.10 stable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXPECTED_SOURCE="127ef9fb1bcc36e908081a3166a09538e37ce0da"
          EXPECTED_IA32="sha256:58dbd663ddeb002eedfa9133764e3c46e73cd0d66269d905f36d12d1e3faf262"
          EXPECTED_X64="sha256:46ee80573f8e2eaa9029fdbdc3230ced272041544c2905c62c0f9fdcef3ae3b0"

          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/tags/v10.5.10 --jq '.object.sha')" = "$EXPECTED_SOURCE"
          test "$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/v10.5.10 --jq '.target_commitish')" = "$EXPECTED_SOURCE"
          test "$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/v10.5.10 --jq '.draft')" = "false"
          test "$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/v10.5.10 --jq '.prerelease')" = "false"
          test "$(gh api repos/${GITHUB_REPOSITORY}/releases/latest --jq '.tag_name')" = "v10.5.10"

          IA32="$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/v10.5.10 --jq '.assets[] | select(.name=="Sharawla-POS-Setup-10.5.10-ia32.exe") | .digest')"
          X64="$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/v10.5.10 --jq '.assets[] | select(.name=="Sharawla-POS-Setup-10.5.10-x64.exe") | .digest')"
          test "$IA32" = "$EXPECTED_IA32"
          test "$X64" = "$EXPECTED_X64"

          echo "V10.5.10_STABLE_IMMUTABLE_GUARD_PASS"
