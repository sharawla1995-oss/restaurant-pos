name: Beta53 Build Windows Release

on:
  push:
    branches:
      - beta53-acceptance-coverage-stage2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Setup Python 3.11 for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pin node-gyp Python
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          "PYTHON=$python" >> $env:GITHUB_ENV
          "npm_config_python=$python" >> $env:GITHUB_ENV
          python --version

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne '10.5.4-beta.53') { throw "Unexpected Beta53 version: $($pkg.version)" }
          "version=$($pkg.version)" >> $env:GITHUB_OUTPUT
          "tag=v$($pkg.version)" >> $env:GITHUB_OUTPUT

      - name: Synchronize runtime version in build workspace
        run: node scripts/sync-version.js

      - name: Install dependencies
        run: npm install --ignore-scripts=false --no-audit --no-fund

      - name: Verify Beta53 source and acceptance gates
        run: npm run check

      - name: Stamp update repository
        shell: pwsh
        run: |
          $cfg = @{ enabled = $true; owner = "${{ github.repository_owner }}"; repo = "${{ github.event.repository.name }}"; channel = "beta"; checkEveryHours = 6 }
          $cfg | ConvertTo-Json | Set-Content update-config.json -Encoding UTF8

      - name: Build Windows x64
        shell: pwsh
        run: npm run dist -- --win --x64 --publish never

      - name: Save x64 installer
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $source = Get-ChildItem dist -Filter "Sharawla-POS-Setup-$version*.exe" | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $source) { throw "x64 installer source not found" }
          Copy-Item $source.FullName "Sharawla-POS-Setup-$version-x64.exe" -Force
          Remove-Item dist -Recurse -Force

      - name: Build Windows ia32
        shell: pwsh
        run: npm run dist -- --win --ia32 --publish never

      - name: Save ia32 installer
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $source = Get-ChildItem dist -Filter "Sharawla-POS-Setup-$version*.exe" | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $source) { throw "ia32 installer source not found" }
          Copy-Item $source.FullName "Sharawla-POS-Setup-$version-ia32.exe" -Force

      - name: Compute installer hashes
        id: hash
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $x64 = (Get-FileHash "Sharawla-POS-Setup-$version-x64.exe" -Algorithm SHA256).Hash.ToLower()
          $ia32 = (Get-FileHash "Sharawla-POS-Setup-$version-ia32.exe" -Algorithm SHA256).Hash.ToLower()
          if ($x64 -eq $ia32) { throw "x64 and ia32 installers unexpectedly have the same SHA256" }
          "x64=$x64" >> $env:GITHUB_OUTPUT
          "ia32=$ia32" >> $env:GITHUB_OUTPUT
          "Sharawla-POS-Setup-$version-x64.exe  $x64" | Set-Content beta53-sha256.txt -Encoding ascii
          "Sharawla-POS-Setup-$version-ia32.exe  $ia32" | Add-Content beta53-sha256.txt -Encoding ascii

      - name: Create or update Beta53 prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $version = "${{ steps.ver.outputs.version }}"
          $notes = @"
          Beta53 Acceptance Coverage Stage 2 for isolated SH-0007 testing.

          This checkpoint preserves the accepted Beta52/Beta51 Offline V2 runtime semantics and adds live Retail acceptance coverage for products and variants, plus sandbox-safe Advanced Purchasing coverage: PO create/idempotency, approval, GRN receive/idempotency, supplier return/idempotency, stock/cost restoration and cleanup. It also validates replenishment suggestions, same-branch transfer atomic rejection, and stock-count rollback on invalid negative quantity.

          Production SH-0005 / SH-0006 and Top Burger remain unchanged and read-only. Canonical device identity, Offline V2 takeover/migration behavior, and the two preserved historical conflicts are unchanged. No automatic migration or takeover replay is introduced.

          SHA256 x64: ${{ steps.hash.outputs.x64 }}
          SHA256 ia32: ${{ steps.hash.outputs.ia32 }}
          "@
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target "${{ github.sha }}" --prerelease --title "Sharawla POS $version" --notes $notes
          }
          $releaseId = gh api "repos/${{ github.repository }}/releases/tags/$tag" --jq ".id"
          if (-not $releaseId) { throw "Could not resolve Beta53 release ID" }
          gh api --method PATCH "repos/${{ github.repository }}/releases/$releaseId" -f target_commitish="${{ github.sha }}" -F prerelease=true -f make_latest=false -f body="$notes" | Out-Null
          gh release upload $tag "Sharawla-POS-Setup-$version-x64.exe" "Sharawla-POS-Setup-$version-ia32.exe" beta53-sha256.txt --clobber
          $latestStableTag = gh api "repos/${{ github.repository }}/releases/latest" --jq ".tag_name"
          if ($latestStableTag -match '-beta') { throw "Stable latest endpoint is pointing to beta: $latestStableTag" }
