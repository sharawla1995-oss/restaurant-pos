name: Top Chicken SH-0008 primary source gate (no release)
on:
  push:
    branches: [release/top-chicken-sh0008-primary-v10.5.19-candidate]
    paths:
      - 'app.js'
      - 'tests/top-chicken/primary-base-port-check.cjs'
      - 'tests/top-chicken/food-line-uid-regression.cjs'
      - '.github/workflows/top-chicken-primary-source-gate.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  primary-source-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Parse primary candidate renderer
        run: node --check app.js
      - name: Verify stable release 10.5.18 base, scoped TC owner routing, and legacy paths
        run: |
          node tests/top-chicken/primary-base-port-check.cjs
          node tests/top-chicken/food-line-uid-regression.cjs
      - name: Preserve unmodified preload and dependency lock from stable baseline
        run: git diff --exit-code v10.5.18 -- preload.js package-lock.json
      - name: Validate in-place identity and dedicated SH-0008 updater
        run: |
          node tests/top-chicken/top-chicken-update-channel.cjs
          node tests/top-chicken/login-edge-route-regression.cjs
          node -e "const p=require('./package.json');if(p.build.appId!=='com.topburger.pos'||p.name!=='sharawla-pos-windows'||p.version!=='10.5.19-rc.4')process.exit(1)"
      - name: Never publish this candidate as generic Production latest
        run: echo "Candidate source verified; public /releases/latest remains owned by stable production"
