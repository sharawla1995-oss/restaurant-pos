name: Beta45 Native SQLite Architecture Check

on:
  push:
    branches:
      - beta45-offline-v2-complete
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-sqlite:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            node_arch: x64
            expected_arch: x64
          - label: ia32
            node_arch: x86
            expected_arch: ia32
    runs-on: windows-latest
    name: sqlite3-${{ matrix.label }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 16 ${{ matrix.node_arch }}
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          architecture: ${{ matrix.node_arch }}
      - name: Install dependencies
        run: npm install --ignore-scripts=false --no-audit --no-fund
      - name: Verify process architecture and sqlite3 native binding
        run: node scripts/probe-beta45-sqlite3-arch.js ${{ matrix.expected_arch }}
      - name: Run source gates
        run: npm run check
