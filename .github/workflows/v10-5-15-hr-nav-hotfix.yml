name: V10.5.15 HR Nav Hotfix Candidate

on:
  push:
    branches:
      - hotfix/v10.5.15-hr-nav-immediate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    if: github.ref_name == 'hotfix/v10.5.15-hr-nav-immediate'
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '16'
      - name: Install dependencies
        run: npm install
      - name: Static and regression gates
        run: npm run check
      - name: Build Windows ia32
        shell: pwsh
        run: npm run dist -- --win --ia32 --publish never
      - name: Save ia32 installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter *.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "ia32 installer not found" }
          Copy-Item $exe.FullName "Sharawla-POS-Setup-10.5.15-ia32.exe"
      - name: Build Windows x64
        shell: pwsh
        run: npm run dist -- --win --x64 --publish never
      - name: Save x64 installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter *.exe | Where-Object { $_.Name -notmatch "ia32|x86" } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "x64 installer not found" }
          Copy-Item $exe.FullName "Sharawla-POS-Setup-10.5.15-x64.exe"
      - name: Upload hotfix candidate
        uses: actions/upload-artifact@v4
        with:
          name: sharawla-pos-10.5.15-hr-nav-hotfix-candidate
          path: |
            Sharawla-POS-Setup-10.5.15-ia32.exe
            Sharawla-POS-Setup-10.5.15-x64.exe
          if-no-files-found: error


  postgres-contract:
    if: github.ref_name == 'hotfix/v10.5.15-hr-nav-immediate'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sharawla_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sharawla_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Load production-contract fixture
        run: psql -h 127.0.0.1 -U postgres -d sharawla_contract -v ON_ERROR_STOP=1 -f scripts/fixtures/v10-5-14-prod-contract.sql
      - name: Apply V10.5.14 production contract
        run: psql -h 127.0.0.1 -U postgres -d sharawla_contract -v ON_ERROR_STOP=1 -f supabase-v10-5-14-ops-hr-notifications-summary.sql
      - name: Apply V10.5.15 modifier quantity migration
        run: |
          psql -h 127.0.0.1 -U postgres -d sharawla_contract -v ON_ERROR_STOP=1 -f supabase-v10-5-15-modifier-quantity.sql
          psql -h 127.0.0.1 -U postgres -d sharawla_contract -v ON_ERROR_STOP=1 -f supabase-v10-5-15-modifier-quantity.sql
      - name: Verify modifier quantity contract
        run: |
          psql -h 127.0.0.1 -U postgres -d sharawla_contract -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if not exists(
              select 1 from information_schema.columns
              where table_schema='public' and table_name='order_item_modifiers'
                and column_name='quantity' and is_nullable='NO'
            ) then raise exception 'modifier quantity column missing'; end if;
            if not exists(
              select 1 from pg_policies
              where schemaname='public' and tablename='order_item_modifiers'
                and policyname='order_item_modifiers_staff_read'
            ) then raise exception 'modifier staff read policy missing'; end if;
            if position('v_mod->>''qty''' in pg_get_functiondef('public.create_pos_order_atomic(jsonb,jsonb,jsonb)'::regprocedure))=0
            then raise exception 'atomic modifier qty persistence missing'; end if;
          end $$;
          SQL
