name: V10.5.16 Restaurant Food Port Candidate

on:
  push:
    branches:
      - feature/v10.5.16-restaurant-inventory-food-ops-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gates:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '16'
      - name: Install dependencies
        run: npm install
      - name: Source / syntax / regression gates
        run: npm run check
