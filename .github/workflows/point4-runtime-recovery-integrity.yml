name: Point4 Runtime Recovery Evidence Integrity Gate
on:
  push:
    branches: [ beta56-offline-ownership-consolidation ]
    paths:
      - 'evidence/point4-runtime-recovery-2026-09-22/**'
      - 'scripts/check-point4-runtime-recovery-integrity.js'
      - '.github/workflows/point4-runtime-recovery-integrity.yml'
  workflow_dispatch:
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify immutable recovered runtime evidence
        run: node scripts/check-point4-runtime-recovery-integrity.js
