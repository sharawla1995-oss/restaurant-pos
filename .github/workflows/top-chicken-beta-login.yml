name: Top Chicken Beta Login Source Checks
on:
  push:
    branches:
      - codex/top-chicken-first-admin-beta-only
  pull_request:
    branches:
      - compat/v10.5.15-desktop-multitenant-client-v2
  workflow_dispatch:
jobs:
  source-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node --check scripts/top-chicken-first-admin-beta.mjs
      - run: node --test tests/top-chicken-login-source.test.mjs

  windows-candidate:
    needs: source-contract
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run existing project checks
        run: npm run check
      - name: Build x64 NSIS candidate only
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload isolated candidate
        uses: actions/upload-artifact@v4
        with:
          name: Top-Chicken-Beta-Windows-x64-Candidate
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7
