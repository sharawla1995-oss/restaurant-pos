name: Point 4B-2 Genuine Concurrency

on:
  workflow_dispatch:
  push:
    branches:
      - beta56-offline-ownership-consolidation
    paths:
      - '.github/workflows/point4b2-genuine-concurrency.yml'
      - 'scripts/point4b2-genuine-concurrency-setup.sql'
      - 'supabase-point4-stock-v2-foundation.sql'
      - 'supabase-point4-stock-v2-writer.sql'

jobs:
  committed-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sharawla_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sharawla_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: sharawla_ci

    steps:
      - uses: actions/checkout@v4

      - name: Prepare disposable schema
        run: psql -f scripts/point4b2-genuine-concurrency-setup.sql

      - name: Different client_tx_id on same stock identity
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/a.sql <<'SQL'
          \set ON_ERROR_STOP on
          begin;
          select public.p4b2_ci_apply('diff-a','line-a','sale',-10,null);
          select pg_sleep(2);
          commit;
          SQL
          cat > /tmp/b.sql <<'SQL'
          \set ON_ERROR_STOP on
          begin;
          select public.p4b2_ci_apply('diff-b','line-b','sale',-15,null);
          commit;
          SQL
          psql -f /tmp/a.sql > /tmp/a.out 2>&1 &
          A=$!
          sleep 0.3
          psql -f /tmp/b.sql > /tmp/b.out 2>&1 &
          B=$!
          wait "$A"
          wait "$B"
          cat /tmp/a.out
          cat /tmp/b.out
          test "$(psql -Atqc "select quantity_on_hand from public.inventory_stock_balances_v2 where location_id=1 and item_kind='product' and item_id=1")" = "75.000"
          test "$(psql -Atqc "select count(*) from public.inventory_stock_movements_v2 where client_tx_id in ('diff-a','diff-b')")" = "2"

      - name: Concurrent same-idempotency-key replay
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r1.sql <<'SQL'
          \set ON_ERROR_STOP on
          begin;
          select public.p4b2_ci_apply('same-tx','same-line','sale',-5,null);
          select pg_sleep(2);
          commit;
          SQL
          cat > /tmp/r2.sql <<'SQL'
          \set ON_ERROR_STOP on
          begin;
          select public.p4b2_ci_apply('same-tx','same-line','sale',-5,null);
          commit;
          SQL
          psql -f /tmp/r1.sql > /tmp/r1.out 2>&1 &
          A=$!
          sleep 0.3
          psql -f /tmp/r2.sql > /tmp/r2.out 2>&1 &
          B=$!
          wait "$A"
          wait "$B"
          cat /tmp/r1.out
          cat /tmp/r2.out
          test "$(psql -Atqc "select count(*) from public.inventory_stock_movements_v2 where client_tx_id='same-tx' and line_key='same-line'")" = "1"
          test "$(psql -Atqc "select quantity_on_hand from public.inventory_stock_balances_v2 where location_id=1 and item_kind='product' and item_id=1")" = "70.000"

      - name: Concurrent reversal
        shell: bash
        run: |
          set -euo pipefail
          ORIG="$(psql -Atqc "select id from public.inventory_stock_movements_v2 where client_tx_id='diff-a' and line_key='line-a'")"
          test -n "$ORIG"
          cat > /tmp/v1.sql <<SQL
          \set ON_ERROR_STOP on
          begin;
          select public.p4b2_ci_apply('rev-a','rev-line-a','reversal',null,$ORIG);
          select pg_sleep(2);
          commit;
          SQL
          cat > /tmp/v2.sql <<SQL
          \set ON_ERROR_STOP off
          begin;
          select public.p4b2_ci_apply('rev-b','rev-line-b','reversal',null,$ORIG);
          commit;
          SQL
          psql -f /tmp/v1.sql > /tmp/v1.out 2>&1 &
          A=$!
          sleep 0.3
          psql -f /tmp/v2.sql > /tmp/v2.out 2>&1 &
          B=$!
          wait "$A"
          wait "$B" || true
          cat /tmp/v1.out
          cat /tmp/v2.out
          test "$(psql -Atqc "select count(*) from public.inventory_stock_movements_v2 where reversal_of_movement_id=$ORIG")" = "1"
          test "$(psql -Atqc "select quantity_on_hand from public.inventory_stock_balances_v2 where location_id=1 and item_kind='product' and item_id=1")" = "80.000"

      - name: Final evidence
        run: |
          psql -P pager=off -c "select id,client_tx_id,line_key,movement_type,quantity_delta,reversal_of_movement_id,balance_version_after from public.inventory_stock_movements_v2 order by id;"
          psql -P pager=off -c "select * from public.inventory_stock_balances_v2 order by location_id,item_kind,item_id;"
          echo "POINT4B2_GENUINE_COMMITTED_CONCURRENCY_PASS"
