name: SH0007 V67 Exact Direct x64 Build

on:
  push:
    branches:
      - 'build/sh0007-v67-exact-direct-v3'

permissions:
  contents: read

jobs:
  build-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore canonical Git bytes
        shell: pwsh
        run: |
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact V67 candidate identity
        shell: pwsh
        run: |
          @'
          import hashlib, pathlib, sys
          root=pathlib.Path('.')
          expected={}
          for line in pathlib.Path('.v67/V67_CANDIDATE_SHA256SUMS.txt').read_text(encoding='utf-8').splitlines():
              if not line.strip(): continue
              h,p=line.split('  ',1); expected[p]=h
          bad=[]
          for p,h in expected.items():
              q=root/p
              if not q.is_file(): bad.append((p,'MISSING',h)); continue
              got=hashlib.sha256(q.read_bytes()).hexdigest()
              if got!=h: bad.append((p,got,h))
          actual=[]
          for q in root.rglob('*'):
              if not q.is_file(): continue
              p=q.as_posix()
              if p.startswith('.git/') or p.startswith('.v67/') or p=='.github/workflows/sh0007-v67-direct-build.yml': continue
              actual.append(p)
          extra=sorted(set(actual)-set(expected)); missing=sorted(set(expected)-set(actual))
          print(f'V67_EXPECTED={len(expected)} ACTUAL={len(actual)} BAD_HASH={len(bad)} EXTRA={len(extra)} MISSING={len(missing)}')
          if len(expected)!=1036 or bad or extra or missing: sys.exit(1)
          print('V67_EXACT_CANDIDATE_1036_1036_PASS')
          '@ | python -
      - name: Verify pinned application version
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          if ($v -ne '10.5.4-beta.58.32') { throw "Unexpected version: $v" }
      - name: Prepare continuation baseline fixture
        shell: pwsh
        run: |
          @'
          import pathlib, subprocess
          base="2d174feff680c4ffc0dd6972036590d259f75626"
          out=pathlib.Path("..")/"continuation_baseline"
          out.mkdir(exist_ok=True)
          for name in ("permissions-v2-delivery-settings-routing.js","permissions-v2-order-fulfillment-routing.js"):
              (out/name).write_bytes(subprocess.check_output(["git","show",f"{base}:{name}"]))
          print("CONTINUATION_BASELINE_READY")
          '@ | python -
      - name: Run authoritative V67 source gates
        shell: pwsh
        run: |
          $tests = @(
            'check-batch1-continuation.js',
            'check-batch1-final-gaps.js',
            'check-batch1-final-review.js',
            'check-batch1-restaurant-families.js',
            'check-batch1-ui.js',
            'check-beta58-26-restaurant-point4-canonical-tx.js',
            'check-bon-final-definition-chain.js',
            'check-bon-runtime-policy-read.js',
            'check-bon-source-closure.js',
            'check-bon-v3-transport-boundary.js',
            'check-offline-closure-batch1.js',
            'check-offline-modern-food-final-dispatcher.js',
            'check-offline-reference-return-behavior.js',
            'check-offline-restaurant-table-config-runtime.js',
            'check-offline-restaurant-table-session-runtime.js',
            'check-rc1-pending-sale-return-v1.js',
            'check-rc1-runtime-alignment-final-dispatcher.js',
            'offline-reference-return-sql-contract.js'
          )
          foreach ($t in $tests) {
            Write-Host "=== V67 SOURCE GATE: $t ==="
            node "scripts/$t"
            if ($LASTEXITCODE -ne 0) { throw "V67 source gate failed: $t" }
          }
          Write-Host "V67_AUTHORITATIVE_SOURCE_GATES_PASS=18/18"
      - uses: actions/setup-node@v4
        with:
          node-version: '16'
      - name: Pin node-gyp Python
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          "PYTHON=$python" >> $env:GITHUB_ENV
          "npm_config_python=$python" >> $env:GITHUB_ENV
      - name: Install dependencies
        run: npm install --ignore-scripts=false --no-audit --no-fund
      - name: Verify version sync
        run: npm run sync-version
      - name: Build Windows x64 installer
        run: npm run dist -- --win --x64 --publish never
      - name: Save V67 SH-0007 installer and SHA256
        shell: pwsh
        run: |
          $version = '10.5.4-beta.58.32'
          $source = Get-ChildItem dist -Filter "Sharawla-POS-Setup-$version*.exe" | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $source) { throw "x64 installer not found" }
          $target = "Sharawla-POS-Setup-$version-V67-SH0007-x64.exe"
          Copy-Item $source.FullName $target -Force
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLower()
          "$target  $hash" | Set-Content V67-SH0007-SHA256.txt -Encoding ascii
          "$env:GITHUB_SHA" | Set-Content V67-SH0007-SOURCE-SHA.txt -Encoding ascii
      - name: Upload V67 SH-0007 x64 candidate
        uses: actions/upload-artifact@v4
        with:
          name: sharawla-pos-v67-sh0007-x64
          path: |
            Sharawla-POS-Setup-10.5.4-beta.58.32-V67-SH0007-x64.exe
            V67-SH0007-SHA256.txt
            V67-SH0007-SOURCE-SHA.txt
          if-no-files-found: error
          retention-days: 7
