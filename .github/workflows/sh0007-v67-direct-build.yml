name: SH0007 V67 Practical Complete Candidate x64 Build

on:
  push:
    branches:
      - 'build/sh0007-v67-direct-*'

permissions:
  contents: read

concurrency:
  group: sh0007-v67-direct-x64
  cancel-in-progress: false

jobs:
  source-gate:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.out.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact practical candidate Git blob bytes
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          manifest=json.loads(pathlib.Path('.v67/V67_PRACTICAL_BUILD_BLOB_MANIFEST.json').read_text(encoding='utf-8'))
          for meta in manifest:
              p=pathlib.Path(meta['path'])
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(subprocess.check_output(['git','cat-file','blob',meta['blob_sha']]))
          print(f'V67_PRACTICAL_BLOB_BYTES_RESTORED={len(manifest)}')
          PY
      - name: Verify practical candidate identity 1056 of 1056
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, sys
          root=pathlib.Path('.')
          manifest=json.loads(pathlib.Path('.v67/V67_PRACTICAL_BUILD_BLOB_MANIFEST.json').read_text(encoding='utf-8'))
          expected={x['path']:x['blob_sha'] for x in manifest}
          excluded={'.github/workflows/sh0007-v67-direct-build.yml'}
          actual=[]
          for q in root.rglob('*'):
              if not q.is_file(): continue
              p=q.as_posix().removeprefix('./')
              if p.startswith('.git/') or p.startswith('.v67/') or p in excluded: continue
              actual.append(p)
          def git_blob_sha(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\x00'+data).hexdigest()
          bad=[]
          for p,want in expected.items():
              q=root/p
              if not q.is_file(): continue
              got=git_blob_sha(q.read_bytes())
              if got!=want: bad.append((p,got,want))
          extra=sorted(set(actual)-set(expected)); missing=sorted(set(expected)-set(actual))
          print(f'V67_PRACTICAL_EXPECTED={len(expected)} ACTUAL={len(actual)} BAD={len(bad)} EXTRA={len(extra)} MISSING={len(missing)}')
          if len(expected)!=1056 or bad or extra or missing:
              for x in bad[:50]: print('BAD',*x)
              for x in extra[:50]: print('EXTRA',x)
              for x in missing[:50]: print('MISSING',x)
              sys.exit(1)
          print('V67_PRACTICAL_COMPLETE_1056_1056_PASS')
          PY
      - name: Run accepted V67 source closure suites
        shell: bash
        run: |
          set -euo pipefail
          suites=(
            scripts/check-batch1-continuation.js
            scripts/check-batch1-final-gaps.js
            scripts/check-batch1-final-review.js
            scripts/check-batch1-restaurant-families.js
            scripts/check-batch1-ui.js
            scripts/check-beta58-26-restaurant-point4-canonical-tx.js
            scripts/check-bon-final-definition-chain.js
            scripts/check-bon-runtime-policy-read.js
            scripts/check-bon-source-closure.js
            scripts/check-bon-v3-transport-boundary.js
            scripts/check-offline-closure-batch1.js
            scripts/check-offline-modern-food-final-dispatcher.js
            scripts/check-offline-reference-return-behavior.js
            scripts/check-offline-restaurant-table-config-runtime.js
            scripts/check-offline-restaurant-table-session-runtime.js
            scripts/check-rc1-pending-sale-return-v1.js
            scripts/check-rc1-runtime-alignment-final-dispatcher.js
            scripts/offline-reference-return-sql-contract.js
          )
          for s in "${suites[@]}"; do
            echo "=== V67 SOURCE SUITE: $s ==="
            node "$s"
          done
          echo "V67_ACCEPTED_SOURCE_SUITES_PASS=18/18"
      - id: out
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-x64:
    needs: source-gate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-gate.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '16'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore exact practical candidate Git blob bytes
        shell: pwsh
        run: |
          @'
          import json, pathlib, subprocess
          manifest=json.loads(pathlib.Path('.v67/V67_PRACTICAL_BUILD_BLOB_MANIFEST.json').read_text(encoding='utf-8'))
          for meta in manifest:
              p=pathlib.Path(meta['path'])
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(subprocess.check_output(['git','cat-file','blob',meta['blob_sha']]))
          print(f'V67_PRACTICAL_BLOB_BYTES_RESTORED={len(manifest)}')
          '@ | python -
      - name: Verify practical candidate identity before build
        shell: pwsh
        run: |
          @'
          import hashlib, json, pathlib, sys
          manifest=json.loads(pathlib.Path('.v67/V67_PRACTICAL_BUILD_BLOB_MANIFEST.json').read_text(encoding='utf-8'))
          def git_blob_sha(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\x00'+data).hexdigest()
          bad=[]
          for meta in manifest:
              p=pathlib.Path(meta['path'])
              if not p.is_file(): bad.append((meta['path'],'MISSING',meta['blob_sha'])); continue
              got=git_blob_sha(p.read_bytes())
              if got!=meta['blob_sha']: bad.append((meta['path'],got,meta['blob_sha']))
          print(f'V67_WINDOWS_PREBUILD_EXPECTED={len(manifest)} BAD={len(bad)}')
          if len(manifest)!=1056 or bad:
              for x in bad[:50]: print('BAD',*x)
              sys.exit(1)
          print('V67_WINDOWS_PREBUILD_1056_1056_PASS')
          '@ | python -
      - name: Pin node-gyp Python
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          "PYTHON=$python" >> $env:GITHUB_ENV
          "npm_config_python=$python" >> $env:GITHUB_ENV
      - name: Install build dependencies
        run: npm install --ignore-scripts=false --no-audit --no-fund
      - name: Restore exact candidate source after dependency install
        shell: pwsh
        run: |
          @'
          import hashlib, json, pathlib, subprocess, sys
          manifest=json.loads(pathlib.Path('.v67/V67_PRACTICAL_BUILD_BLOB_MANIFEST.json').read_text(encoding='utf-8'))
          def git_blob_sha(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\x00'+data).hexdigest()
          bad=[]
          for meta in manifest:
              p=pathlib.Path(meta['path'])
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(subprocess.check_output(['git','cat-file','blob',meta['blob_sha']]))
              got=git_blob_sha(p.read_bytes())
              if got!=meta['blob_sha']: bad.append((meta['path'],got,meta['blob_sha']))
          print(f'V67_POST_INSTALL_RESTORE={len(manifest)} BAD={len(bad)}')
          if bad:
              for x in bad[:50]: print('BAD',*x)
              sys.exit(1)
          print('V67_POST_INSTALL_EXACT_BYTES_PASS')
          '@ | python -
      - name: Build Windows x64 installer
        run: npm run dist -- --win --x64 --publish never
      - name: Save V67 SH-0007 installer and SHA256
        shell: pwsh
        run: |
          $version = '10.5.4-beta.58.32'
          $source = Get-ChildItem dist -Filter "Sharawla-POS-Setup-$version*.exe" | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $source) { throw "x64 installer not found" }
          $target = "Sharawla-POS-Setup-$version-V67-SH0007-x64.exe"
          Copy-Item $source.FullName $target -Force
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLower()
          "$target  $hash" | Set-Content V67-SH0007-SHA256.txt -Encoding ascii
          "${{ needs.source-gate.outputs.source_sha }}" | Set-Content V67-SH0007-SOURCE-SHA.txt -Encoding ascii
          Get-Content V67-SH0007-SHA256.txt
      - name: Upload V67 SH-0007 x64 candidate
        uses: actions/upload-artifact@v4
        with:
          name: sharawla-pos-v67-sh0007-x64
          path: |
            Sharawla-POS-Setup-10.5.4-beta.58.32-V67-SH0007-x64.exe
            V67-SH0007-SHA256.txt
            V67-SH0007-SOURCE-SHA.txt
          if-no-files-found: error
          retention-days: 7
