name: Build Windows Release

on:
  push:
    branches:
      - release/v10.5.13-production-prep
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref_name == 'release/v10.5.13-production-prep'
    runs-on: windows-2022

    steps:
      - name: Checkout certified 10.5.13 candidate
        uses: actions/checkout@v4
        with:
          ref: 54490d9ae1c8ca7de0cf20b852d77b97d326c7a7
          fetch-depth: 1

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne "10.5.13") { throw "Unexpected package version: $($pkg.version)" }
          "version=$($pkg.version)" >> $env:GITHUB_OUTPUT
          "tag=v$($pkg.version)" >> $env:GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Stamp update repository
        shell: pwsh
        run: |
          $cfg = @{
            enabled = $true
            owner = "${{ github.repository_owner }}"
            repo = "${{ github.event.repository.name }}"
            channel = "stable"
            checkEveryHours = 6
          }
          $cfg | ConvertTo-Json | Set-Content update-config.json -Encoding UTF8

      - name: Install dependencies
        run: npm install

      - name: Verify certified candidate source
        run: npm run check

      - name: Stamp production metadata
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.description = "Sharawla POS V10.5.13 Production - operations polish + HR Staff"
          $pkg | ConvertTo-Json -Depth 100 | Set-Content package.json -Encoding UTF8

          $ver = Get-Content version.json -Raw | ConvertFrom-Json
          if ($ver.version -ne "10.5.13" -or $ver.channel -ne "candidate") {
            throw "Unexpected certified candidate metadata"
          }
          $ver.channel = "production"
          $ver.notes = "Top Burger Production stable 10.5.13. Operations polish + HR/Staff runtime."
          $ver | ConvertTo-Json -Depth 100 | Set-Content version.json -Encoding UTF8

      - name: Build Windows x64
        shell: pwsh
        run: |
          npx electron-builder --win nsis --x64 --publish never

      - name: Save x64 installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter *.exe |
            Where-Object { $_.Name -notmatch "ia32|x86" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $exe) { throw "x64 installer not found" }
          Copy-Item $exe.FullName "Sharawla-POS-Setup-${{ steps.ver.outputs.version }}-x64.exe"

      - name: Build Windows ia32
        shell: pwsh
        run: |
          npx electron-builder --win nsis --ia32 --publish never

      - name: Save ia32 installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter *.exe |
            Where-Object { $_.Name -match "ia32|x86" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem dist -Filter *.exe |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
          }
          if (-not $exe) { throw "ia32 installer not found" }
          Copy-Item $exe.FullName "Sharawla-POS-Setup-${{ steps.ver.outputs.version }}-ia32.exe"

      - name: Generate SHA256 manifest
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $x64=(Get-FileHash "Sharawla-POS-Setup-$version-x64.exe" -Algorithm SHA256).Hash.ToLower()
          $ia32=(Get-FileHash "Sharawla-POS-Setup-$version-ia32.exe" -Algorithm SHA256).Hash.ToLower()
          "Sharawla-POS-Setup-$version-x64.exe  $x64" | Set-Content "production-v$version-sha256.txt" -Encoding ascii
          "Sharawla-POS-Setup-$version-ia32.exe  $ia32" | Add-Content "production-v$version-sha256.txt" -Encoding ascii

      - name: Refuse existing stable tag or release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          git fetch --tags --force
          $tagExists = git tag --list $tag
          if ($tagExists) { throw "Stable tag $tag already exists and is immutable." }

          $releaseExists = gh release list --limit 100 --json tagName --jq ".[] | select(.tagName == \"$tag\") | .tagName"
          if ($releaseExists) { throw "Stable release $tag already exists and is immutable." }

          Write-Host "No existing stable tag/release for $tag"

      - name: Create immutable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $version = "${{ steps.ver.outputs.version }}"
          gh release create $tag `
            --target "54490d9ae1c8ca7de0cf20b852d77b97d326c7a7" `
            --title "Sharawla POS $version — Production 10.5.13 — Operations + HR" `
            --notes "Top Burger Production stable 10.5.13 built from certified candidate 54490d9ae1c8ca7de0cf20b852d77b97d326c7a7. Production database migrations are deployed separately. Installer preserves local device identity and data."
          gh release upload $tag `
            "Sharawla-POS-Setup-$version-x64.exe" `
            "Sharawla-POS-Setup-$version-ia32.exe" `
            "production-v$version-sha256.txt"
