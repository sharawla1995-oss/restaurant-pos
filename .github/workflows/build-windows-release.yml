name: Build Windows Release

on:
  push:
    branches:
      - release/v10.5.14-production-prep
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref_name == 'release/v10.5.14-production-prep'
    runs-on: windows-2022

    steps:
      - name: Checkout certified 10.5.14 candidate
        uses: actions/checkout@v4
        with:
          ref: ffcee8195ae3e14675b96d9175a9cb97f003590a
          fetch-depth: 1

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne "10.5.14") { throw "Unexpected package version: $($pkg.version)" }
          "version=$($pkg.version)" >> $env:GITHUB_OUTPUT
          "tag=v$($pkg.version)" >> $env:GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Stamp stable updater
        shell: pwsh
        run: |
          $cfg = @{
            enabled = $true
            owner = "${{ github.repository_owner }}"
            repo = "${{ github.event.repository.name }}"
            channel = "stable"
            checkEveryHours = 6
          }
          $cfg | ConvertTo-Json | Set-Content update-config.json -Encoding UTF8

      - name: Install dependencies
        run: npm install

      - name: Verify certified candidate source
        run: npm run check

      - name: Stamp production metadata
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.description = "Sharawla POS V10.5.14 Production - operations, HR, notifications and Summary V2"
          $pkg | ConvertTo-Json -Depth 100 | Set-Content package.json -Encoding UTF8

          $ver = Get-Content version.json -Raw | ConvertFrom-Json
          if ($ver.version -ne "10.5.14" -or $ver.channel -ne "candidate") {
            throw "Unexpected certified candidate metadata"
          }
          $ver.channel = "production"
          $ver.notes = "Top Burger Production stable 10.5.14. Fast Orders, delivery payment confirmation, Notifications V1, HR approval/branch disbursement, Staff self-service, HR Hub and Summary V2."
          $ver | ConvertTo-Json -Depth 100 | Set-Content version.json -Encoding UTF8

      - name: Build Windows x64
        shell: pwsh
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Save x64 installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter *.exe |
            Where-Object { $_.Name -notmatch "ia32|x86" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $exe) { throw "x64 installer not found" }
          Copy-Item $exe.FullName "Sharawla-POS-Setup-${{ steps.ver.outputs.version }}-x64.exe"

      - name: Build Windows ia32
        shell: pwsh
        run: npx electron-builder --win nsis --ia32 --publish never

      - name: Save ia32 installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter *.exe |
            Where-Object { $_.Name -match "ia32|x86" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem dist -Filter *.exe |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
          }
          if (-not $exe) { throw "ia32 installer not found" }
          Copy-Item $exe.FullName "Sharawla-POS-Setup-${{ steps.ver.outputs.version }}-ia32.exe"

      - name: Generate SHA256 manifest
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $x64=(Get-FileHash "Sharawla-POS-Setup-$version-x64.exe" -Algorithm SHA256).Hash.ToLower()
          $ia32=(Get-FileHash "Sharawla-POS-Setup-$version-ia32.exe" -Algorithm SHA256).Hash.ToLower()
          "Sharawla-POS-Setup-$version-x64.exe  $x64" | Set-Content "production-v$version-sha256.txt" -Encoding ascii
          "Sharawla-POS-Setup-$version-ia32.exe  $ia32" | Add-Content "production-v$version-sha256.txt" -Encoding ascii

      - name: Refuse existing stable tag or release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          git fetch --tags --force
          $tagExists = git tag --list $tag
          if ($tagExists) { throw "Stable tag $tag already exists and is immutable." }

          $releaseListJson = gh release list --limit 100 --json tagName
          if ($LASTEXITCODE -ne 0) { throw "Unable to inspect existing GitHub releases." }
          $releaseExists = ($releaseListJson | ConvertFrom-Json) | Where-Object { $_.tagName -eq $tag }
          if ($releaseExists) { throw "Stable release $tag already exists and is immutable." }

          Write-Host "No existing stable tag/release for $tag"

      - name: Create immutable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $version = "${{ steps.ver.outputs.version }}"
          gh release create $tag `
            --target "ffcee8195ae3e14675b96d9175a9cb97f003590a" `
            --title "Sharawla POS $version — Production 10.5.14 — Ops + HR + Summary" `
            --notes "Top Burger Production stable 10.5.14 built from certified candidate ffcee8195ae3e14675b96d9175a9cb97f003590a. Candidate CI 37462350217 passed Windows x64/ia32, PostgreSQL V14 contract, and emergency rollback-to-10.5.13 gate. Production DB V14 migrations and Staff Edge Functions were deployed before release. Emergency rollback source is included in this release and preserves additive data."
          gh release upload $tag `
            "Sharawla-POS-Setup-$version-x64.exe" `
            "Sharawla-POS-Setup-$version-ia32.exe" `
            "production-v$version-sha256.txt" `
            "supabase-v10-5-14-emergency-rollback-to-10-5-13.sql"
