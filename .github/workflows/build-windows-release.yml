name: V10.5.8 Stable Immutable Guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-immutable:
    if: github.ref_name == 'release/v10.5.8-production-recipe'
    runs-on: ubuntu-latest
    steps:
      - name: Verify immutable production release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v10.5.8"
          EXPECTED="fae709d59d5cf55197bb41432b92c2a42bca3de5"
          REF_SHA="$(gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" --jq .object.sha)"
          RELEASE_TARGET="$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq .target_commitish)"
          test "$REF_SHA" = "$EXPECTED"
          test "$RELEASE_TARGET" = "$EXPECTED"
          echo "V10.5.8_STABLE_IMMUTABLE_GUARD_PASS"
