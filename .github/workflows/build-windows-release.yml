name: Build Windows Release

on:
  push:
    branches:
      - main
      - beta18-website-integration-foundation
      - beta19-core-parity-fix-pack
      - beta20-retail-engine-hotfix
      - beta21-self-test-center
      - beta22-runtime-acceptance-fixes
      - beta23-full-retail-candidate
      - beta25-retail-finalization
      - beta26-retail-ui-delivery-finalization
      - beta27-retail-delivery-owner-diagnostics
      - beta28-owner-users-home-fix
      - beta29-retail-functional-finalization
      - beta30-pharmacy-complete
      - beta31-pharmacy-ui-hotfix
      - beta32-capability-platform-foundation
      - beta33-cloud-runtime-v2
      - beta34-feature-consumption-bridge
      - beta35-feature-behavior-gates
      - beta36-multi-engine-integration
      - beta37-variants-startup-hotfix
      - beta38-retail-variants-runtime-fix
      - beta39-variants-root-fix
      - beta40-variants-acceptance
      - beta41-purchasing-acceptance
      - beta42-capability-module-registry
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Required source preflight
        shell: pwsh
        run: |
          $required = @("package.json","scripts/sync-version.js","scripts/check-version.js","scripts/check-beta36-multi-engine.js","scripts/check-beta36-landed-cost.js","scripts/check-beta37-variants-startup.js","scripts/check-beta38-retail-variants-runtime.js","scripts/check-beta39-capability-v3.js","scripts/check-beta40-variants-acceptance.js","scripts/check-beta41-purchasing-acceptance.js","scripts/check-beta42-capability-module-registry.js","scripts/check-owner-diagnostics.js","scripts/check-beta28-fixes.js","scripts/check-beta29-functional.js","scripts/check-beta30-pharmacy.js","scripts/check-beta31-pharmacy-ui.js","scripts/check-beta32-capabilities.js","scripts/check-beta33-cloud-runtime-v2.js","scripts/check-beta34-feature-consumption.js","scripts/check-beta35-feature-behavior.js","sharawla-capabilities.js","sharawla-capabilities-beta33.js","sharawla-capabilities-v3.js","sharawla-capability-runtime-bridge.js","sharawla-capability-module-registry.js","sharawla-cloud-runtime-v2.js","sharawla-feature-consumption.js","food-recipe-runtime-bridge.js","food-recipe-ui-v1.js","food-advanced-ui-v1.js","beta34-feature-ui.js","beta35-feature-behavior.js","beta36-integration-loader.js","beta36-offline-v2.js","permissions-v2-ui.js","printing-v2.js","landed-cost-posting-v1.js","retail-variants-startup-hotfix.js","advanced-purchasing-runtime-bridge.js","advanced-purchasing-v1.js","service-engine.js","warehouse-engine.js","membership-engine.js","logistics-engine.js","commerce-orders-v2-ui.js","reports-v2-ui.js","finance-b2b-ui.js","service-v1-ui.js","warehouse-v1-ui.js","membership-v1-ui.js","logistics-v1-ui.js","sharawla-web-v1/index.html","sharawla-web-v1/app.js","sharawla-web-v1/sw.js","docs/BETA36-RC-ACCEPTANCE.md","docs/PRODUCTION-MIGRATION-PLAN-V1.md","docs/SUPPORT-RECOVERY-GUIDE-V1.md","docs/PRODUCTION-V1-FREEZE-CHECKLIST.md","beta28-runtime-fixes.js","beta29-retail-functional-finalization.js","pharmacy-engine.js","pharmacy-ui.js",".github/workflows/build-windows-release.yml","version-ui.js")
          foreach ($file in $required) { if (-not (Test-Path $file)) { throw "Required source file missing: $file" } }
          $index = Get-Content index.html -Raw
          $chain = @("sharawla-runtime-core.js","sharawla-capabilities.js","sharawla-capabilities-beta33.js","sharawla-capabilities-v3.js","sharawla-capability-runtime-bridge.js","sharawla-feature-consumption.js","sharawla-cloud-runtime-v2.js","restaurant-engine.js")
          $last = -1
          foreach ($asset in $chain) {
            $needle = $asset + "?v="
            $pos = $index.IndexOf($needle)
            if ($pos -lt 0) { throw "Source shell missing before sync: $asset" }
            if ($pos -le $last) { throw "Unsafe source shell order at: $asset" }
            $last = $pos
          }
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $isBeta = [bool]($pkg.version -match '-beta(?:\.|$)')
          "version=$($pkg.version)" >> $env:GITHUB_OUTPUT
          "tag=v$($pkg.version)" >> $env:GITHUB_OUTPUT
          "prerelease=$isBeta" >> $env:GITHUB_OUTPUT
          "channel=$(if ($isBeta) { 'beta' } else { 'stable' })" >> $env:GITHUB_OUTPUT
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '16'
      - name: Stamp update repository
        shell: pwsh
        run: |
          $cfg = @{ enabled = $true; owner = "${{ github.repository_owner }}"; repo = "${{ github.event.repository.name }}"; channel = "${{ steps.ver.outputs.channel }}"; checkEveryHours = 6 }
          $cfg | ConvertTo-Json | Set-Content update-config.json -Encoding UTF8
      - name: Install dependencies
        run: npm install
      - name: Verify version
        run: npm run check
      - name: Build Windows x64
        shell: pwsh
        run: npm run dist -- --win --x64 --publish never
      - name: Save x64 installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter *.exe | Where-Object { $_.Name -notmatch "ia32|x86" } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "x64 installer not found" }
          Copy-Item $exe.FullName "Sharawla-POS-Setup-${{ steps.ver.outputs.version }}-x64.exe"
      - name: Build Windows ia32
        shell: pwsh
        run: npm run dist -- --win --ia32 --publish never
      - name: Save ia32 installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter *.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "ia32 installer not found" }
          Copy-Item $exe.FullName "Sharawla-POS-Setup-${{ steps.ver.outputs.version }}-ia32.exe"
      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $version = "${{ steps.ver.outputs.version }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            if ("${{ steps.ver.outputs.prerelease }}" -eq "True") { gh release create $tag --target "${{ github.sha }}" --prerelease --title "Sharawla POS $version" --notes "Sharawla POS Windows beta release" }
            else { gh release create $tag --target "${{ github.sha }}" --title "Sharawla POS $version" --notes "Sharawla POS Windows stable release" }
          }
          $releaseId = gh api "repos/${{ github.repository }}/releases/tags/$tag" --jq ".id"
          if (-not $releaseId) { throw "Could not resolve GitHub Release ID for $tag" }
          if ("${{ steps.ver.outputs.prerelease }}" -eq "True") { gh api --method PATCH "repos/${{ github.repository }}/releases/$releaseId" -F prerelease=true -f make_latest=false | Out-Null }
          else { gh api --method PATCH "repos/${{ github.repository }}/releases/$releaseId" -F prerelease=false -f make_latest=true | Out-Null }
          $betaRows = gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" --jq '.[] | select((.draft == false) and (.tag_name | contains("-beta"))) | "\(.id)|\(.tag_name)"'
          foreach ($row in $betaRows) { if (-not $row) { continue }; $parts = $row -split '\|', 2; $betaId = $parts[0]; $betaTag = $parts[1]; gh api --method PATCH "repos/${{ github.repository }}/releases/$betaId" -F prerelease=true -f make_latest=false | Out-Null; Write-Host "Normalized beta release: $betaTag => prerelease=true, make_latest=false" }
          $badBetas = gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" --jq '.[] | select((.draft == false) and (.tag_name | contains("-beta")) and (.prerelease != true)) | .tag_name'
          if ($badBetas) { throw "Beta release classification enforcement failed. Still non-prerelease: $($badBetas -join ', ')" }
          $actualPrerelease = gh api "repos/${{ github.repository }}/releases/$releaseId" --jq ".prerelease"
          $expectedPrerelease = "${{ steps.ver.outputs.prerelease }}".ToLower()
          if ($actualPrerelease.ToLower() -ne $expectedPrerelease) { throw "Release classification mismatch for $tag. Expected prerelease=$expectedPrerelease, actual=$actualPrerelease" }
          try { $latestStableTag = gh api "repos/${{ github.repository }}/releases/latest" --jq ".tag_name"; if ($latestStableTag -match '-beta') { throw "Stable latest endpoint is pointing to a beta release: $latestStableTag" } } catch { throw "Could not verify stable /releases/latest after release normalization. $($_.Exception.Message)" }
          gh release upload $tag "Sharawla-POS-Setup-$version-x64.exe" "Sharawla-POS-Setup-$version-ia32.exe" --clobber
