name: Build Windows Release

on:
  push:
    branches:
      - release/v10.5.13-production-prep
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref_name == 'release/v10.5.13-production-prep'
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          "version=$($pkg.version)" >> $env:GITHUB_OUTPUT
          "tag=v$($pkg.version)" >> $env:GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Stamp update repository
        shell: pwsh
        run: |
          $cfg = @{
            enabled = $true
            owner = "${{ github.repository_owner }}"
            repo = "${{ github.event.repository.name }}"
            channel = "stable"
            checkEveryHours = 6
          }

          $cfg | ConvertTo-Json | Set-Content update-config.json -Encoding UTF8

      - name: Install dependencies
        run: npm install

      - name: Verify pinned candidate source
        run: npm run check

      - name: Stamp production package metadata
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne "10.5.13") { throw "Unexpected package version: $($pkg.version)" }
          $pkg.description = "Sharawla POS V10.5.13 Production - operations polish + HR Staff"
          $pkg | ConvertTo-Json -Depth 100 | Set-Content package.json -Encoding UTF8

          $ver = Get-Content version.json -Raw | ConvertFrom-Json
          if ($ver.version -ne "10.5.13") { throw "Unexpected version.json version: $($ver.version)" }
          $ver.channel = "production"
          $ver.notes = "Top Burger Production stable 10.5.13. Operations polish + HR/Staff runtime."
          $ver | ConvertTo-Json -Depth 100 | Set-Content version.json -Encoding UTF8

          $verify = Get-Content version.json -Raw | ConvertFrom-Json
          if ($verify.channel -ne "production") { throw "Production metadata stamp failed" }

      - name: Build Windows x64
        shell: pwsh
        run: |
          npx electron-builder --win nsis --x64 --publish never

      - name: Save x64 installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter *.exe |
            Where-Object { $_.Name -notmatch "ia32|x86" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $exe) {
            throw "x64 installer not found"
          }

          Copy-Item $exe.FullName "Sharawla-POS-Setup-${{ steps.ver.outputs.version }}-x64.exe"

      - name: Build Windows ia32
        shell: pwsh
        run: |
          npx electron-builder --win nsis --ia32 --publish never

      - name: Save ia32 installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter *.exe |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $exe) {
            throw "ia32 installer not found"
          }

          Copy-Item $exe.FullName "Sharawla-POS-Setup-${{ steps.ver.outputs.version }}-ia32.exe"

      - name: Refuse existing stable tag or release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"

          git fetch --tags --force
          git rev-parse "refs/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Stable tag $tag already exists and is immutable."
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Stable release $tag already exists and is immutable."
          }

      - name: Create immutable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $version = "${{ steps.ver.outputs.version }}"

          gh release create $tag `
            --target "${{ github.sha }}" `
            --title "Sharawla POS $version — Production 10.5.13 — Operations + HR" `
            --notes "Top Burger Production stable 10.5.13. Includes the reviewed operations polish and HR/Staff runtime. Production database migrations are deployed separately; installer preserves local device identity and data."

          gh release upload $tag `
            "Sharawla-POS-Setup-$version-x64.exe" `
            "Sharawla-POS-Setup-$version-ia32.exe"
