name: V10.5.12 Stable Immutable Guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify immutable v10.5.12 stable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXPECTED_SOURCE="abc487b60b71c911b3d396acc82e765f54d9a5c2"
          EXPECTED_IA32="sha256:292d67ec926e61448b839e101e9d570c1adf2065e9fef1568a0e7b907bf6d548"
          EXPECTED_X64="sha256:a053b6684593598bcace77ba24c07a16447541e48004675a567dc56798539ecc"

          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/tags/v10.5.12 --jq '.object.sha')" = "$EXPECTED_SOURCE"
          test "$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/v10.5.12 --jq '.target_commitish')" = "$EXPECTED_SOURCE"
          test "$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/v10.5.12 --jq '.draft')" = "false"
          test "$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/v10.5.12 --jq '.prerelease')" = "false"
          test "$(gh api repos/${GITHUB_REPOSITORY}/releases/latest --jq '.tag_name')" = "v10.5.12"

          IA32="$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/v10.5.12 --jq '.assets[] | select(.name=="Sharawla-POS-Setup-10.5.12-ia32.exe") | .digest')"
          X64="$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/v10.5.12 --jq '.assets[] | select(.name=="Sharawla-POS-Setup-10.5.12-x64.exe") | .digest')"
          test "$IA32" = "$EXPECTED_IA32"
          test "$X64" = "$EXPECTED_X64"

          echo "V10.5.12_STABLE_IMMUTABLE_GUARD_PASS"
