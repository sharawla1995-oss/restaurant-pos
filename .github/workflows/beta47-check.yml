name: Beta47 Performance Sync Hotfix Check

on:
  push:
    branches:
      - beta47-performance-sync-hotfix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '16'
      - name: Syntax check Beta47 hotfix runtime
        run: |
          node --check beta47-performance-sync-hotfix.js
          node --check owner-acceptance-lazy-loader-v47.js
          node --check owner-acceptance-ui-v47.js
          node --check beta36-integration-loader.js
      - name: Run source and acceptance gates
        run: npm run check
