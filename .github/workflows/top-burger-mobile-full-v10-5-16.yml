name: Top Burger Mobile Full V10.5.16
on:
  push:
    branches: [feature/top-burger-mobile-v10.5.16-full-parity]
  workflow_dispatch:
jobs:
  full-mobile-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node --check top-burger-mobile/app.js
      - run: node --check top-burger-mobile/sw.js
      - run: node --check top-burger-mobile/v10-5-16-restaurant-closure-ui.js
      - run: node --check top-burger-mobile/inventory-overview-v10-5-16.js
      - run: node --check top-burger-mobile/food-advanced-ui-v10-5-16.js
      - run: node --check top-burger-mobile/food-recipe-runtime-bridge-v10-5-16.js
      - run: node scripts/check-top-burger-mobile-full-v10-5-16.js
