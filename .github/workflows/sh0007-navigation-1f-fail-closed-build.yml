name: SH-0007 Unified Navigation 1F Build

on:
  push:
    branches:
      - nav-registry-1f-fail-closed-sh0007-build

permissions:
  contents: read

jobs:
  build-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f3b2b41fccf417de520a6b3699a337734ad198d9
          fetch-depth: 1

      - name: Verify exact candidate
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          Write-Host "HEAD=$actual"
          if ($actual -ne "f3b2b41fccf417de520a6b3699a337734ad198d9") { throw "candidate mismatch: $actual" }

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure node-gyp Python
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          "PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "npm_config_python=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Sync version
        run: npm run sync-version

      - name: Fail-closed safety gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/check-unified-navigation-registry.js
          node scripts/check-unified-navigation-registry-1b.js
          node scripts/check-unified-navigation-registry-1c.js
          node scripts/check-unified-navigation-registry-1d-a.js
          node scripts/check-unified-navigation-registry-1d-b-runtime-binding.js
          node scripts/check-navigation-profile-leakage-corrective.js
          node scripts/check-unified-navigation-registry-1e.js
          node scripts/check-unified-navigation-registry-1f.js
          node scripts/check-runtime-syntax.js
          node scripts/check-beta55-restaurant-acceptance.js
          node scripts/check-orders-performance-date-window.js
          node scripts/check-orders-runtime-corrective.js

      - name: Build isolated Windows x64 installer
        run: npx electron-builder --win nsis --x64 --config.npmRebuild=false --publish never

      - name: Verify packaged 1F runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asar = Join-Path $PWD 'dist\win-unpacked\resources\app.asar'
          if (!(Test-Path $asar)) { throw "packaged app.asar missing" }

          $probe = Join-Path $env:RUNNER_TEMP 'sharawla-nav-1f-asar'
          if (Test-Path $probe) { Remove-Item $probe -Recurse -Force }
          New-Item -ItemType Directory -Path $probe | Out-Null
          npx asar extract $asar $probe
          if ($LASTEXITCODE -ne 0) { throw "asar extract failed" }

          $pkg = Get-Content (Join-Path $probe 'package.json') -Raw | ConvertFrom-Json
          if ($pkg.version -ne '10.5.4-beta.58.3') { throw "version mismatch: $($pkg.version)" }

          $app = Get-Content (Join-Path $probe 'app.js') -Raw
          foreach ($token in @(
            "const PAGE_RENDERERS=Object.freeze({",
            "if(typeof renderer!=='function'){blockUnknownRoute(p);return;}",
            "type:'UNKNOWN_ROUTE_BLOCKED'",
            "mode:'FAIL_CLOSED'",
            "orders:renderOrders",
            "ORDERS-DATE-WINDOW-V58.3"
          )) {
            if (!$app.Contains($token)) { throw "missing packaged 1F token: $token" }
          }
          if ($app.Contains("}[p]||renderPOS)")) { throw "legacy unknown-route POS fallback still packaged" }

          Write-Host "PACKAGED NAVIGATION 1F FAIL-CLOSED PASS version=$($pkg.version)"

      - name: Upload SH-0007 installer
        uses: actions/upload-artifact@v4
        with:
          name: sharawla-pos-10.5.4-beta.58.3-navigation-1f-fail-closed-sh0007-x64
          path: dist/Sharawla-POS-Setup-10.5.4-beta.58.3*.exe
          if-no-files-found: error
          retention-days: 7
