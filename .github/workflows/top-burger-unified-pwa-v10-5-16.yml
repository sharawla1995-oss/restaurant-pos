name: Top Burger Unified PWA V10.5.16
on:
  push:
    branches: [feature/v10.5.16-unified-desktop-pwa]
    paths: ['top-burger-unified/**','scripts/check-top-burger-unified-pwa-v10-5-16.js','.github/workflows/top-burger-unified-pwa-v10-5-16.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: top-burger-unified-pages
  cancel-in-progress: true
jobs:
  unified-pwa-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node --check top-burger-unified/app.js
      - run: node --check top-burger-unified/restaurant-engine.js
      - run: node --check top-burger-unified/v10-5-16-restaurant-closure-ui.js
      - run: node --check top-burger-unified/inventory-overview-v10-5-16.js
      - run: node --check top-burger-unified/food-advanced-ui-v10-5-16.js
      - run: node scripts/check-top-burger-unified-pwa-v10-5-16.js

  deploy-pages:
    needs: unified-pwa-gate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site/top-burger-unified
          cp -a top-burger-unified/. _site/top-burger-unified/
          cp icon-192.png icon-512.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
