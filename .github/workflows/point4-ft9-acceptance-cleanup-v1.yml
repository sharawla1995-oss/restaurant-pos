name: Point4 FT9 Contract 35 Acceptance Cleanup V1 Gate
on:
  push:
    branches: [ beta56-offline-ownership-consolidation ]
    paths:
      - 'supabase-point4-ft9-acceptance-cleanup-v1-guard.sql'
      - 'scripts/check-point4-ft9-acceptance-cleanup-v1.js'
      - 'evidence/point4-runtime-recovery-2026-09-22/**'
      - '.github/workflows/point4-ft9-acceptance-cleanup-v1.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Semantic gate
        run: node scripts/check-point4-ft9-acceptance-cleanup-v1.js
      - name: PostgreSQL 16 compile and effective definition read-back
        run: |
          cat > /tmp/h.sql <<'SQL'
          create schema auth; create function auth.uid() returns uuid language sql as $$select null::uuid$$;
          create table employees(auth_user_id uuid,active boolean);
          create table retail_inventory_movements(branch_id bigint,product_id bigint,quantity_delta numeric,client_tx_id text);
          create table returns(id bigint,client_tx_id text); create table orders(id bigint,client_tx_id text,customer_id bigint);
          create table return_payments(return_id bigint); create table return_items(return_id bigint);
          create table order_items(id bigint,order_id bigint); create table order_item_modifiers(order_item_id bigint); create table order_payments(order_id bigint);
          create table expenses(client_tx_id text); create table offline_v2_server_receipts(client_tx_id text); create table customers(id bigint,notes text);
          create table logistics_shipments_v1(client_customer_id bigint); create table logistics_pickup_requests_v1(client_customer_id bigint);
          create table logistics_client_settlements_v1(client_customer_id bigint); create table service_appointments_v1(customer_id bigint); create table service_jobs_v1(customer_id bigint);
          create function inventory_stock_assert_legacy_write_allowed_v2(bigint,text,bigint) returns void language plpgsql as $$begin return;end$$;
          create function sharawla_acceptance_scan_v1(text) returns jsonb language sql as $$select '{"total":0}'::jsonb$$;
          SQL
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/h.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase-point4-ft9-acceptance-cleanup-v1-guard.sql
          psql -h localhost -U postgres -d postgres -Atc "select pg_get_functiondef('public.sharawla_acceptance_cleanup_v1(text)'::regprocedure)" > /tmp/effective.sql
          grep -q "inventory_stock_assert_legacy_write_allowed_v2" /tmp/effective.sql
          grep -q "v_ownership" /tmp/effective.sql
          grep -q "ACCEPTANCE_CLEANUP_STOCK_NOT_ZERO" /tmp/effective.sql
          echo "POINT4_FT9_35_POSTGRES_PASS create=1 readback=1 guard=1 frozen_products=1"
