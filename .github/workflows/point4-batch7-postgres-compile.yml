name: Point4 Batch7 Semantic and PostgreSQL Compile Gate
on:
  push:
    branches: [ beta56-offline-ownership-consolidation ]
    paths:
      - 'supabase-point4-pre-cutover-46-guard-installation-batch7-retail-transfers.sql'
      - 'scripts/check-point4-batch7-retail-transfers.js'
      - '.github/workflows/point4-batch7-postgres-compile.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - name: Assert isolation
        run: echo "No Supabase/Beta/Production credentials are used by this workflow."
      - name: Semantic
        run: node scripts/check-point4-batch7-retail-transfers.js
      - name: Compile stubs
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create schema auth; create function auth.uid() returns uuid language sql as $$select '00000000-0000-0000-0000-000000000001'::uuid$$;
          create function public.is_admin() returns boolean language sql as $$select true$$;
          create function public.has_permission(text) returns boolean language sql as $$select true$$;
          create function public.has_branch_access(bigint) returns boolean language sql as $$select true$$;
          create function public.current_employee_id() returns bigint language sql as $$select 1::bigint$$;
          create function public.inventory_stock_assert_legacy_write_allowed_v2(bigint,text,bigint) returns void language plpgsql as $$begin return; end$$;
          create table public.retail_transfers(id bigserial,from_branch_id bigint,to_branch_id bigint,notes text,client_tx_id text,status text default 'sent',created_by_employee_id bigint,received_by_employee_id bigint,received_at timestamptz);
          create table public.retail_transfer_items(transfer_id bigint,product_id bigint,quantity numeric,unit_cost numeric);
          create table public.retail_inventory_balances(branch_id bigint,product_id bigint,quantity numeric,track_inventory boolean,average_unit_cost numeric,last_purchase_cost numeric,updated_at timestamptz);
          create unique index on public.retail_inventory_balances(branch_id,product_id);
          create table public.retail_inventory_movements(branch_id bigint,product_id bigint,movement_type text,quantity_delta numeric,balance_after numeric,unit_cost numeric,reference_type text,reference_id text,client_tx_id text,employee_id bigint);
          SQL
      - name: Extract and compile
        run: |
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('supabase-point4-pre-cutover-46-guard-installation-batch7-retail-transfers.sql').read_text()
          ds=re.findall(r'(?is)(create or replace function\s+public\.(?:retail_transfer_create|retail_transfer_receive)\s*\(.*?end\s*\$\$;)',s)
          assert len(ds)==2, len(ds)
          pathlib.Path('/tmp/b7.sql').write_text('\n\n'.join(ds))
          print('EXTRACT_COMPLETE functions=2')
          PY
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/b7.sql
          echo "POSTGRES_CREATE_PASS functions=2"
      - name: Verify effective definitions
        run: |
          test "$(psql -h localhost -U postgres -d postgres -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('retail_transfer_create','retail_transfer_receive')")" = "2"
          echo "PG_FUNCTIONS_EXIST=2"
