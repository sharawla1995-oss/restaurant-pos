name: Point4 Batch1 PostgreSQL Compile Gate

on:
  push:
    branches: [beta56-offline-ownership-consolidation]
    paths:
      - "supabase-point4-pre-cutover-46-guard-installation-batch1-insertion-only.sql"
      - ".github/workflows/point4-batch1-postgres-compile.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: point4_compile
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d point4_compile"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: point4_compile

    steps:
      - uses: actions/checkout@v4

      - name: Assert isolated compile gate
        shell: bash
        run: |
          set -euo pipefail
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_DB_URL:-}"
          test -z "${DATABASE_URL:-}"
          echo "No Supabase/Beta/Production credentials are used by this workflow."

      - name: Install minimum compile stubs
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;

          create or replace function public.inventory_stock_assert_legacy_write_allowed_v2(bigint,text,bigint)
          returns void language plpgsql as $$ begin return; end $$;

          create or replace function public.inventory_stock_assert_document_workflow_allowed_v2(text)
          returns void language plpgsql as $$ begin return; end $$;

          create or replace function public.current_employee_id()
          returns bigint language sql as $$ select 1::bigint $$;

          create or replace function public.has_permission(text)
          returns boolean language sql as $$ select true $$;

          create table public.ingredients(
            id bigint primary key, active boolean, track_inventory boolean,
            base_unit_id bigint, cost_per_base_unit numeric
          );
          create table public.ingredient_stock(
            branch_id bigint, ingredient_id bigint, quantity numeric default 0,
            average_unit_cost numeric default 0, updated_at timestamptz,
            primary key(branch_id,ingredient_id)
          );
          create table public.ingredient_stock_movements(
            id bigint generated always as identity primary key,
            branch_id bigint, ingredient_id bigint, movement_type text,
            quantity_delta numeric, reference_type text, reference_id bigint,
            notes text, created_at timestamptz default now()
          );
          create table public.food_ingredient_stock_adjustments(
            id bigint generated always as identity primary key,
            branch_id bigint, ingredient_id bigint, quantity_delta numeric,
            quantity_after numeric, unit_cost numeric, reason text,
            client_tx_id text, employee_id bigint
          );
          create table public.food_waste_events(
            id bigint generated always as identity primary key,
            branch_id bigint, ingredient_id bigint, prep_item_id bigint,
            shift_id bigint, reason_code text, quantity numeric,
            base_quantity numeric, unit_code text, notes text,
            client_tx_id text, employee_id bigint, created_at timestamptz default now()
          );
          create table public.retail_inventory_balances(
            branch_id bigint, product_id bigint, quantity numeric default 0,
            track_inventory boolean default true, low_stock_threshold numeric default 0,
            updated_at timestamptz, primary key(branch_id,product_id)
          );
          create table public.retail_inventory_movements(
            id bigint generated always as identity primary key,
            branch_id bigint, product_id bigint, movement_type text,
            quantity_delta numeric, quantity_after numeric, reference_type text,
            reference_id text, client_tx_id text, notes text, employee_id bigint
          );
          create table public.retail_variant_inventory_balances(
            branch_id bigint, variant_id bigint, quantity numeric default 0,
            updated_at timestamptz, primary key(branch_id,variant_id)
          );
          create table public.retail_variant_inventory_movements(
            id bigint generated always as identity primary key,
            branch_id bigint, variant_id bigint, movement_type text,
            quantity_delta numeric, quantity_after numeric, reference_type text,
            reference_id text, client_tx_id text, notes text, employee_id bigint
          );
          create table public.inventory_supply_requests(
            id bigint primary key, status text, source_location_id bigint,
            destination_branch_id bigint, submitted_by_employee_id bigint,
            submitted_at timestamptz, decision_note text, updated_at timestamptz
          );
          create table public.inventory_supply_request_items(
            id bigint generated always as identity primary key,
            request_id bigint, quantity_reserved numeric
          );
          create table public.inventory_supply_request_events(
            id bigint generated always as identity primary key,
            request_id bigint, from_status text, to_status text, note text,
            employee_id bigint, details jsonb
          );
          create table public.audit_logs(
            id bigint generated always as identity primary key,
            employee_id bigint, branch_id bigint, action text, entity_type text,
            entity_id bigint, details jsonb
          );
          SQL

      - name: Initialize evidence report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p point4-compile-evidence
          {
            echo "POINT4_BATCH1_POSTGRES_COMPILE_EVIDENCE_V1"
            echo "tested_commit_sha=$GITHUB_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "source_path=supabase-point4-pre-cutover-46-guard-installation-batch1-insertion-only.sql"
            echo "source_sha256=$(sha256sum supabase-point4-pre-cutover-46-guard-installation-batch1-insertion-only.sql | awk '{print $1}')"
            echo "postgres_version=$(psql -Atc 'show server_version')"
          } > point4-compile-evidence/report.txt

      - name: Compile nine source definitions verbatim
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="supabase-point4-pre-cutover-46-guard-installation-batch1-insertion-only.sql"
          python3 - <<'PY'
          import re, pathlib
          p=pathlib.Path("supabase-point4-pre-cutover-46-guard-installation-batch1-insertion-only.sql")
          s=p.read_text()
          starts=[m.start() for m in re.finditer(r'(?im)^CREATE OR REPLACE FUNCTION\s+',s)]
          if len(starts)!=9:
              raise SystemExit(f"WORKFLOW_EXTRACTION_DEFECT: expected 9 function starts, found {len(starts)}")
          parts=[]
          for i,start in enumerate(starts):
              stop=starts[i+1] if i+1 < len(starts) else len(s)
              block=s[start:stop]
              delimiters=list(re.finditer(r'\$function\,block,re.I))
              if len(delimiters)!=2:
                  raise SystemExit(f"WORKFLOW_EXTRACTION_DEFECT: function {i+1} expected exactly 2 $function$ delimiters, found {len(delimiters)}")
              close=delimiters[1].end()
              part=block[:close]
              if not re.search(r'\bAS\s+\$function\,part,re.I):
                  raise SystemExit(f"WORKFLOW_EXTRACTION_DEFECT: function {i+1} missing AS $function$ opening delimiter")
              if not part.rstrip().endswith("$function$"):
                  raise SystemExit(f"WORKFLOW_EXTRACTION_DEFECT: function {i+1} missing closing delimiter")
              parts.append(part)
          if len(parts)!=9:
              raise SystemExit(f"WORKFLOW_EXTRACTION_DEFECT: expected 9 complete definitions, found {len(parts)}")
          for i,part in enumerate(parts,1):
              pathlib.Path(f"/tmp/point4-fn-{i}.sql").write_text(part+";\\n")
              print(f"EXTRACT_SUCCESS function={i} delimiters=2 bytes={len(part.encode())}")
          print("EXTRACT_COMPLETE functions=9")
          PY
          overall=0
          for i in $(seq 1 9); do
            name=$(sed -n 's/^CREATE OR REPLACE FUNCTION public\.\([^ (]*\).*/\1/p' "/tmp/point4-fn-$i.sql" | head -1)
            digest=$(sha256sum "/tmp/point4-fn-$i.sql" | awk '{print $1}')
            echo "=== COMPILE FUNCTION $i/9: $name ==="
            if psql -v ON_ERROR_STOP=1 -f "/tmp/point4-fn-$i.sql" >"/tmp/point4-fn-$i.log" 2>&1; then
              echo "function=$i name=$name source_digest=$digest create=PASS" | tee -a point4-compile-evidence/report.txt
            else
              cat "/tmp/point4-fn-$i.log"
              echo "function=$i name=$name source_digest=$digest create=FAIL classification=UNCLASSIFIED_REQUIRES_LOG_REVIEW" | tee -a point4-compile-evidence/report.txt
              cp "/tmp/point4-fn-$i.log" point4-compile-evidence/
              overall=1
            fi
          done
          echo "create_pass_count=$(grep -c 'create=PASS' point4-compile-evidence/report.txt || true)" >> point4-compile-evidence/report.txt
          test "$overall" -eq 0

      - name: Verify 9 functions exist and capture pg_get_functiondef
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -At <<'SQL' | tee /tmp/point4-functiondefs.txt
          select p.oid::regprocedure::text
          from pg_proc p join pg_namespace n on n.oid=p.pronamespace
          where n.nspname='public'
            and p.proname in (
              'food_apply_ingredient_delta_internal_v1',
              'food_ingredient_stock_adjust_v1',
              'food_waste_post_v1',
              'retail_inventory_adjust',
              'retail_inventory_set_item_policy',
              'retail_variant_inventory_adjust_v1',
              'inventory_supply_request_cancel_v1',
              'inventory_supply_request_prepare_v1',
              'inventory_supply_request_submit_v1'
            )
          order by 1;
          SQL
          test "$(wc -l < /tmp/point4-functiondefs.txt)" -eq 9
          psql -v ON_ERROR_STOP=1 -Atc "
            select pg_get_functiondef(p.oid)
            from pg_proc p join pg_namespace n on n.oid=p.pronamespace
            where n.nspname='public'
              and p.proname in (
                'food_apply_ingredient_delta_internal_v1','food_ingredient_stock_adjust_v1',
                'food_waste_post_v1','retail_inventory_adjust','retail_inventory_set_item_policy',
                'retail_variant_inventory_adjust_v1','inventory_supply_request_cancel_v1',
                'inventory_supply_request_prepare_v1','inventory_supply_request_submit_v1'
              )
            order by p.oid::regprocedure::text;" > /tmp/point4-pg-get-functiondef.txt
          cp /tmp/point4-functiondefs.txt point4-compile-evidence/function-signatures.txt
          cp /tmp/point4-pg-get-functiondef.txt point4-compile-evidence/pg-get-functiondef.txt
          echo "existence_count=9" >> point4-compile-evidence/report.txt
          echo "pg_get_functiondef_count=9" >> point4-compile-evidence/report.txt
          sha256sum /tmp/point4-pg-get-functiondef.txt | awk '{print "pg_get_functiondef_bundle_sha256="$1}' >> point4-compile-evidence/report.txt
          echo "PG_GET_FUNCTIONDEF_CAPTURED=9"

      - name: Final static guard counts
        shell: bash
        run: |
          set -euo pipefail
          f="supabase-point4-pre-cutover-46-guard-installation-batch1-insertion-only.sql"
          test "$(grep -c 'CREATE OR REPLACE FUNCTION' "$f")" -eq 9
          test "$(grep -c 'perform public.inventory_stock_assert_legacy_write_allowed_v2' "$f")" -eq 6
          test "$(grep -c 'perform public.inventory_stock_assert_document_workflow_allowed_v2' "$f")" -eq 3
          ! grep -Eqi 'declare_cutover|activate_cutover|CANONICAL_COMMITTED|cutover-hooks' "$f"
          echo "guard_legacy=6/6" >> point4-compile-evidence/report.txt
          echo "guard_document=3/3" >> point4-compile-evidence/report.txt
          echo "cutover_canonical_activation=0" >> point4-compile-evidence/report.txt
          echo "STATIC_COUNTS_PASS functions=9 legacy=6 document=3 activation=0"

      - name: Finalize evidence on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p point4-compile-evidence
          echo "job_result=FAIL" >> point4-compile-evidence/report.txt

      - name: Finalize evidence on success
        if: success()
        shell: bash
        run: |
          echo "job_result=PASS" >> point4-compile-evidence/report.txt

      - name: Upload immutable compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: point4-batch1-postgres-compile-evidence-${{ github.sha }}
          path: point4-compile-evidence/
          if-no-files-found: error
          retention-days: 90
