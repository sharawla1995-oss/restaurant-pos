name: Beta52 Source Sync

on:
  push:
    branches:
      - beta52-acceptance-coverage-closure
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Synchronize Beta52 runtime source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sync-version.js
          node scripts/check-beta52-crash-evidence.js
          node scripts/check-version.js

      - name: Commit synchronized Beta52 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sharawla1995-oss"
          git config user.email "sharawla1995@gmail.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Beta52: synchronize runtime versions"
            git push origin HEAD:beta52-acceptance-coverage-closure
          fi
