name: SH0007 V67 Exact Candidate x64 Build v4

on:
  push:
    branches:
      - 'build/sh0007-v67-exact-candidate-v4'

permissions:
  contents: read

jobs:
  build-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2a2c615bcd71a7a55a128352d228d7b0bb1d72ee
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '16'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact V67 candidate commit and tree
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($head -ne '2a2c615bcd71a7a55a128352d228d7b0bb1d72ee') { throw "candidate SHA mismatch: $head" }
          if ($tree -ne '56ebe0463ec056297dce899b7c4cb0174f3fbd89') { throw "candidate tree mismatch: $tree" }
          $version = node -p "require('./package.json').version"
          if ($version -ne '10.5.4-beta.58.32') { throw "version mismatch: $version" }
          Write-Host 'V67_EXACT_CANDIDATE_SHA_TREE_PASS'

      - name: Pin node-gyp Python
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          "PYTHON=$python" >> $env:GITHUB_ENV
          "npm_config_python=$python" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: npm install --ignore-scripts=false --no-audit --no-fund

      - name: Run full source and regression gates
        run: npm run check:ci

      - name: Build Windows x64 installer
        run: npm run dist -- --win --x64 --publish never

      - name: Save V67 SH-0007 installer and provenance
        shell: pwsh
        run: |
          $version = '10.5.4-beta.58.32'
          $source = Get-ChildItem dist -Filter "Sharawla-POS-Setup-$version*.exe" | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $source) { throw "x64 installer not found" }
          $target = "Sharawla-POS-Setup-$version-V67-SH0007-x64.exe"
          Copy-Item $source.FullName $target -Force
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLower()
          "$target  $hash" | Set-Content V67-SH0007-SHA256.txt -Encoding ascii
          "2a2c615bcd71a7a55a128352d228d7b0bb1d72ee" | Set-Content V67-SH0007-SOURCE-SHA.txt -Encoding ascii
          "56ebe0463ec056297dce899b7c4cb0174f3fbd89" | Set-Content V67-SH0007-SOURCE-TREE.txt -Encoding ascii

      - name: Upload V67 SH-0007 x64 candidate
        uses: actions/upload-artifact@v4
        with:
          name: sharawla-pos-v67-sh0007-x64
          path: |
            Sharawla-POS-Setup-10.5.4-beta.58.32-V67-SH0007-x64.exe
            V67-SH0007-SHA256.txt
            V67-SH0007-SOURCE-SHA.txt
            V67-SH0007-SOURCE-TREE.txt
          if-no-files-found: error
          retention-days: 7
