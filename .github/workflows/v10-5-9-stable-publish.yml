name: V10.5.9 Stable Immutable Guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify immutable v10.5.9 stable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXPECTED_SOURCE="82c70566b1d78408f0f8f592defa5056802a57f7"
          EXPECTED_IA32="sha256:64aad17857d6bf81dd05c7576ca667769b9d68aca71ce4ce01a1a4577846896e"
          EXPECTED_X64="sha256:50f2f151f5d5eb45ab7eb679fbf959b3c71eea5ab61f00f9236fd3bc24cf3298"

          TAG_SHA="$(gh api repos/${GITHUB_REPOSITORY}/git/ref/tags/v10.5.9 --jq '.object.sha')"
          test "$TAG_SHA" = "$EXPECTED_SOURCE"

          TARGET="$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/v10.5.9 --jq '.target_commitish')"
          DRAFT="$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/v10.5.9 --jq '.draft')"
          PRE="$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/v10.5.9 --jq '.prerelease')"
          LATEST="$(gh api repos/${GITHUB_REPOSITORY}/releases/latest --jq '.tag_name')"
          test "$TARGET" = "$EXPECTED_SOURCE"
          test "$DRAFT" = "false"
          test "$PRE" = "false"
          test "$LATEST" = "v10.5.9"

          IA32="$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/v10.5.9 --jq '.assets[] | select(.name=="Sharawla-POS-Setup-10.5.9-ia32.exe") | .digest')"
          X64="$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/v10.5.9 --jq '.assets[] | select(.name=="Sharawla-POS-Setup-10.5.9-x64.exe") | .digest')"
          test "$IA32" = "$EXPECTED_IA32"
          test "$X64" = "$EXPECTED_X64"

          echo "V10.5.9_STABLE_IMMUTABLE_GUARD_PASS"
