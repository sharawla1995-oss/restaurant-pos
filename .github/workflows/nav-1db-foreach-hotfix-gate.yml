name: 1D-B Nav forEach Hotfix Gate

on:
  push:
    branches:
      - nav-registry-1d-b-foreach-hotfix-gate

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ed73b1e97be0c9824e9c76d755ed9dd44a1315a3
          fetch-depth: 1

      - name: Verify exact candidate
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "HEAD=$actual"
          test "$actual" = "ed73b1e97be0c9824e9c76d755ed9dd44a1315a3"

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Sync version
        run: npm run sync-version

      - name: Run hotfix and regression gates
        shell: bash
        run: |
          set +e
          node scripts/check-navigation-profile-leakage-corrective.js
          a=$?
          node scripts/check-runtime-syntax.js
          b=$?
          node scripts/check-unified-navigation-registry-1c.js
          c=$?
          node scripts/check-unified-navigation-registry-1d-a.js
          d=$?
          node scripts/check-unified-navigation-registry-1d-b-runtime-binding.js
          e=$?
          node scripts/check-beta55-restaurant-acceptance.js
          f=$?
          node scripts/check-orders-performance-date-window.js
          g=$?
          node scripts/check-orders-runtime-corrective.js
          h=$?
          echo "EXIT_CODES corrective=$a syntax=$b 1c=$c 1da=$d 1db=$e restaurant=$f orders_perf=$g orders_runtime=$h"
          test $a -eq 0 -a $b -eq 0 -a $c -eq 0 -a $d -eq 0 -a $e -eq 0 -a $f -eq 0 -a $g -eq 0 -a $h -eq 0
