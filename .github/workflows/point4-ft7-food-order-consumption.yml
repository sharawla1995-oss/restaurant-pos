name: Point4 FT7 Contract 11 Food Consumption Gate
on:
  push:
    branches: [ beta56-offline-ownership-consolidation ]
    paths:
      - 'supabase-point4-ft7-food-order-consumption-guard.sql'
      - 'scripts/check-point4-ft7-food-order-consumption.js'
      - 'evidence/point4-runtime-recovery-2026-09-22/**'
      - '.github/workflows/point4-ft7-food-order-consumption.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Semantic gate
        run: node scripts/check-point4-ft7-food-order-consumption.js
      - name: PostgreSQL 16 compile and effective definition read-back
        run: |
          cat > /tmp/harness.sql <<'SQL'
          create schema auth;
          create function auth.uid() returns uuid language sql as $$ select null::uuid $$;
          create table public.orders(id bigint,branch_id bigint);
          create table public.order_items(id bigint,order_id bigint,cost numeric);
          create table public.food_recipe_headers(id bigint,active boolean,recipe_kind text,product_id bigint,variant_id bigint);
          create table public.food_recipe_versions(id bigint,recipe_id bigint,status text,output_quantity numeric,effective_from timestamptz,effective_to timestamptz);
          create table public.ingredients(id bigint,active boolean,track_inventory boolean,cost_per_unit numeric);
          create table public.ingredient_stock(id bigserial,branch_id bigint,ingredient_id bigint,quantity numeric,average_unit_cost numeric,updated_at timestamptz, unique(branch_id,ingredient_id));
          create table public.food_recipe_lines(recipe_version_id bigint,ingredient_id bigint,base_quantity numeric);
          create table public.food_recipe_removal_mappings(recipe_version_id bigint,ingredient_id bigint,component_name text);
          create table public.food_modifier_recipe_impacts(recipe_version_id bigint,ingredient_id bigint,modifier_id bigint,base_quantity_delta numeric);
          create table public.food_order_item_cost_snapshots(order_item_id bigint primary key,recipe_version_id bigint,base_recipe_cost numeric,modifier_cost numeric,total_food_cost numeric);
          create table public.food_order_item_consumption_snapshots(order_item_id bigint,recipe_version_id bigint,ingredient_id bigint,source_kind text,modifier_id bigint,base_quantity numeric,unit_cost_snapshot numeric);
          create table public.stock_movements(branch_id bigint,ingredient_id bigint,movement_type text,quantity numeric,reference_type text,reference_id bigint,notes text);
          create function public.has_branch_access(bigint) returns boolean language sql as $$ select true $$;
          create function public.inventory_stock_assert_legacy_write_allowed_v2(bigint,text,bigint) returns void language plpgsql as $$ begin return; end $$;
          SQL
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/harness.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase-point4-ft7-food-order-consumption-guard.sql
          psql -h localhost -U postgres -d postgres -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='food_apply_order_consumption_v1';" | grep -qx 1
          psql -h localhost -U postgres -d postgres -Atc "select pg_get_functiondef('public.food_apply_order_consumption_v1(jsonb,jsonb)'::regprocedure);" > /tmp/effective.sql
          grep -q "inventory_stock_assert_legacy_write_allowed_v2" /tmp/effective.sql
          grep -q "v_frozen_lines" /tmp/effective.sql
          grep -q "food_recipe_removal_mappings" /tmp/effective.sql
          grep -q "food_modifier_recipe_impacts" /tmp/effective.sql
          echo "POINT4_FT7_11_POSTGRES_PASS create=1 readback=1 guard=1 frozen=1"
