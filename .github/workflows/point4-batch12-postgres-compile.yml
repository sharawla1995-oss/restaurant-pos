name: Point4 Batch12 Supply Request Decide Semantic and PostgreSQL Compile Gate
on:
  push:
    branches: [ beta56-offline-ownership-consolidation ]
    paths:
      - 'supabase-beta55-central-warehouse-foundation.sql'
      - 'scripts/check-point4-batch12-supply-request-decide.js'
      - '.github/workflows/point4-batch12-postgres-compile.yml'
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - name: Assert exact source lineage
        run: |
          grep -F "v_frozen_approved:=v_frozen_approved||jsonb_build_array(v_frozen_item)" supabase-beta55-central-warehouse-foundation.sql
          test -f scripts/check-point4-batch12-supply-request-decide.js
          node scripts/check-point4-batch12-supply-request-decide.js
          echo "FROZEN_FIX_AND_SEMANTIC_PRESENT=1"
      - name: Assert isolation
        run: echo "No Supabase/Beta/Production credentials are used by this workflow."
      - name: Semantic
        run: node scripts/check-point4-batch12-supply-request-decide.js
      - name: Build compile stubs
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create schema auth;
          create function auth.uid() returns uuid language sql as $$select '00000000-0000-0000-0000-000000000001'::uuid$$;
          create function public.has_action_permission_v2(text) returns boolean language sql as $$select true$$;
          create function public.has_branch_access(bigint) returns boolean language sql as $$select true$$;
          create function public.current_employee_id() returns bigint language sql as $$select 1::bigint$$;
          create function public.inventory_stock_assert_document_workflow_allowed_v2(text) returns void language plpgsql as $$begin return; end$$;
          create table public.inventory_supply_requests(id bigint,status text,source_location_id bigint,destination_branch_id bigint,decision_note text,decided_by_employee_id bigint,decided_at timestamptz,updated_at timestamptz);
          create table public.inventory_supply_request_items(id bigint,request_id bigint,quantity_requested numeric,quantity_approved numeric);
          create table public.inventory_supply_request_events(request_id bigint,from_status text,to_status text,note text,employee_id bigint);
          create table public.audit_logs(employee_id bigint,branch_id bigint,action text,entity_type text,entity_id bigint,details jsonb);
          SQL
      - name: Compile decide
        run: |
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('supabase-beta55-central-warehouse-foundation.sql').read_text()
          m=re.search(r'(?is)(create or replace function\s+public\.inventory_supply_request_decide_v1\s*\(.*?end\s*\$\$;)',s)
          assert m, 'function missing'
          pathlib.Path('/tmp/b12.sql').write_text(m.group(1))
          PY
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/b12.sql
      - name: Verify effective definition and same frozen set
        run: |
          psql -h localhost -U postgres -d postgres -Atc "select pg_get_functiondef('public.inventory_supply_request_decide_v1(bigint,boolean,jsonb,text)'::regprocedure)" > /tmp/effective.sql
          grep -F "v_frozen_approved:=v_frozen_approved||jsonb_build_array(v_frozen_item)" /tmp/effective.sql
          grep -F "from jsonb_to_recordset(v_frozen_approved)" /tmp/effective.sql
          test "$(grep -o 'jsonb_to_recordset(p_approved_items)' /tmp/effective.sql | wc -l)" = "1"
          python3 - <<'PY'
          s=open('/tmp/effective.sql').read().lower()
          g=s.index('inventory_stock_assert_document_workflow_allowed_v2')
          assert 'jsonb_to_recordset(p_approved_items)' not in s[g:], 'input reparsed after guard'
          assert 'jsonb_to_recordset(v_frozen_approved)' in s[g:], 'frozen set not executed after guard'
          print('EFFECTIVE_SOURCE_READBACK_PASS')
          PY
