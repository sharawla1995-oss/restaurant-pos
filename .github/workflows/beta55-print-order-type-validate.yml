name: Beta55 Print Order Type Validation

on:
  push:
    branches:
      - beta55-print-order-type-work
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gates:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '16'
      - name: Print runtime syntax
        run: |
          node --check beta55-print-order-type.js
          node --check owner-acceptance-beta55-print-v55.js
          node --check scripts/check-beta55-print-order-type.js
      - name: Print order type contract gate
        run: node scripts/check-beta55-print-order-type.js
      - name: Full source and regression gates
        run: npm run check
