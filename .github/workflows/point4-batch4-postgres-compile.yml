name: Point4 Batch4 Semantic and PostgreSQL Compile Gate
on:
  push:
    branches: [ beta56-offline-ownership-consolidation ]
    paths:
      - 'supabase-point4-pre-cutover-46-guard-installation-batch4-website-create-identity.sql'
      - 'scripts/check-point4-batch4-website-create-identity.js'
      - '.github/workflows/point4-batch4-postgres-compile.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - name: Assert isolation
        run: echo "No Supabase/Beta/Production credentials are used by this workflow."
      - name: Run semantic checker
        run: node scripts/check-point4-batch4-website-create-identity.js
      - name: Install compile stubs
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists auth; create schema if not exists extensions;
          create extension if not exists pgcrypto with schema extensions;
          create function auth.uid() returns uuid language sql as $$select null::uuid$$;
          create table public.retail_reservation_documents_identity_v1(id bigint,retail_website_order_id bigint,document_uid uuid,creation_client_tx_id uuid,creation_operation_digest text);
          create table public.retail_website_orders(id bigint,public_order_code text,branch_id bigint,idempotency_key text,reservation_key text,customer_name text,customer_phone text,customer_address text,customer_notes text,order_type text,delivery_zone_id bigint,payment_method_code text,payment_status text,payment_reference text,subtotal numeric,offer_discount numeric,delivery_fee numeric,total numeric,status text,reservation_expires_at timestamptz);
          create table public.retail_reservation_lines_identity_v1(reservation_document_id bigint,line_uid uuid,product_id bigint,quantity numeric,normalized_notes text,reservation_effect_line_key text,canonical_line_digest text);
          create table public.retail_website_order_items(retail_website_order_id bigint,product_id bigint,product_name text,unit_type text,quantity numeric,unit_price numeric,unit_cost_snapshot numeric,line_subtotal numeric,offer_discount numeric,line_total numeric,notes text);
          create table public.retail_stock_reservations(branch_id bigint,product_id bigint,quantity numeric,reservation_key text,status text,expires_at timestamptz,website_order_id bigint);
          create table public.products(id bigint,active boolean,name text,price numeric,cost numeric);
          create table public.retail_product_settings(product_id bigint,unit_type text,allow_decimal boolean,qty_step numeric,min_qty numeric,online_enabled boolean);
          create table public.retail_inventory_balances(branch_id bigint,product_id bigint,quantity numeric,track_inventory boolean);
          create table public.branch_products(branch_id bigint,product_id bigint,active boolean,website_paused_until timestamptz,price_override numeric);
          create function public.point4_identity_assert_allowed_keys_v1(jsonb,text[]) returns void language plpgsql as $$begin return; end$$;
          create function public.point4_identity_uuid_v4_v1(text) returns text language sql as $$select $1$$;
          create function public.point4_identity_source_document_id_v1(text,text,boolean) returns text language sql as $$select $2$$;
          create function public.point4_identity_bigint_v1(jsonb,boolean) returns bigint language sql as $$select 1::bigint$$;
          create function public.point4_identity_decimal_v1(numeric,integer) returns numeric language sql as $$select $1$$;
          create function public.point4_identity_effect_line_key_v1(text,text,text) returns text language sql as $$select $3$$;
          create function public.retail_website_normalize_phone(text) returns text language sql as $$select $1$$;
          create function public.retail_reservation_identity_digest_v1(text,text,text,bigint,jsonb,jsonb) returns text language sql as $$select 'digest'$$;
          create function public.retail_website_offer_discount(bigint,bigint,numeric,numeric) returns numeric language sql as $$select 0::numeric$$;
          create function public.inventory_stock_assert_legacy_write_allowed_v2(bigint,text,bigint) returns void language plpgsql as $$begin return; end$$;
          create function public.retail_reservation_identity_assert_projection_v1(bigint) returns void language plpgsql as $$begin return; end$$;
          SQL
      - name: Extract and compile definition
        run: |
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('supabase-point4-pre-cutover-46-guard-installation-batch4-website-create-identity.sql').read_text()
          m=re.search(r'(?is)(create or replace function\s+public\.retail_create_website_order_identity_v1\s*\(.*?\n\$\$;)',s)
          assert m, 'definition not found'
          assert len(re.findall(r'(?im)^create or replace function\s+',s))==1
          pathlib.Path('/tmp/b4.sql').write_text(m.group(1))
          print('EXTRACT_COMPLETE functions=1')
          PY
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/b4.sql
          echo "POSTGRES_CREATE_PASS functions=1"
      - name: Verify effective definition
        run: |
          test "$(psql -h localhost -U postgres -d postgres -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='retail_create_website_order_identity_v1'")" = "1"
          echo "PG_FUNCTIONS_EXIST=1"
