name: Beta45 Offline Engine V2 Check

on:
  push:
    branches:
      - beta45-offline-v2-complete
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '16'
      - name: Run source and acceptance gates
        run: npm run check
