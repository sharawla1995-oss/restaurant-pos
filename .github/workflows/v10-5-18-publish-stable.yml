name: Publish V10.5.18 Stable
# release trigger: regression gate aligned
on:
  push:
    branches:
      - release/v10.5.18-desktop-inventory-parity
    paths:
      - .github/workflows/v10-5-18-publish-stable.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.ref_name == 'release/v10.5.18-desktop-inventory-parity'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '16'
      - run: npm install
      - run: npm run check
      - name: Exact Extras website gate
        run: node scripts/check-v10-5-16-website-exact-extras.js
      - name: Desktop inventory parity gate
        shell: pwsh
        run: |
          $engine = Get-Content restaurant-engine.js -Raw
          $app = Get-Content app.js -Raw
          $html = Get-Content index.html -Raw
          foreach($token in @("suppliers:'inventory'","purchasing:'inventory'","stockCount:'inventory'","transfers:'inventory'","foodIngredients:'food.ingredients'","foodRecipes:'food.recipes'","foodOperations:'inventory'")){
            if(-not $engine.Contains($token)){ throw "Missing restaurant-engine parity token: $token" }
          }
          foreach($page in @('suppliers','purchasing','stockCount','transfers','foodIngredients','foodRecipes','foodOperations')){
            if(-not $html.Contains('data-page="'+$page+'"')){ throw "Missing desktop nav page: $page" }
          }
          if(-not $app.Contains("foodPort?.sharedRoutes?.includes?.(p)")){ throw "Missing shared restaurant route dispatch" }
          foreach($token in @('id="settlementHistoryBody" hidden','settlements.slice(0,3)','id="showAllSettlements"','toggleSettlementHistory.onclick')){
            if(-not $app.Contains($token)){ throw "Missing collapsed settlement history token: $token" }
          }
      - name: Build ia32
        run: npm run dist -- --win --ia32 --publish never
      - name: Save ia32
        shell: pwsh
        run: |
          $exe=Get-ChildItem dist -Filter *.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if(-not $exe){throw 'ia32 installer not found'}
          Copy-Item $exe.FullName 'Sharawla-POS-Setup-10.5.18-ia32.exe'
      - name: Clean dist before x64
        shell: pwsh
        run: Remove-Item -Recurse -Force dist
      - name: Build x64
        run: npm run dist -- --win --x64 --publish never
      - name: Save x64
        shell: pwsh
        run: |
          $exe=Get-ChildItem dist -Filter *.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if(-not $exe){throw 'x64 installer not found'}
          Copy-Item $exe.FullName 'Sharawla-POS-Setup-10.5.18-x64.exe'
      - name: Write SHA256
        shell: pwsh
        run: |
          Get-FileHash Sharawla-POS-Setup-10.5.18-ia32.exe -Algorithm SHA256 | ForEach-Object { ($_.Hash.ToLower() + '  Sharawla-POS-Setup-10.5.18-ia32.exe') } | Set-Content production-v10.5.18-sha256.txt
          Get-FileHash Sharawla-POS-Setup-10.5.18-x64.exe -Algorithm SHA256 | ForEach-Object { ($_.Hash.ToLower() + '  Sharawla-POS-Setup-10.5.18-x64.exe') } | Add-Content production-v10.5.18-sha256.txt
      - name: Publish stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v10.5.18 Sharawla-POS-Setup-10.5.18-ia32.exe Sharawla-POS-Setup-10.5.18-x64.exe production-v10.5.18-sha256.txt --target $env:GITHUB_SHA --title 'Sharawla POS 10.5.18 — Production Stable' --notes 'Production Stable 10.5.18. Cumulative from V10.5.17 with Desktop parity for Suppliers, Purchasing, Stock Count, Transfers, Ingredients, Recipes/Food Cost, and Production/Waste using the existing restaurant inventory/food runtimes. Exact Extras behavior remains preserved.'
