name: Beta58.1 Orders Runtime Corrective Build

on:
  push:
    branches:
      - beta56-runtime-snapshot-consumer
      - beta56-offline-ownership-consolidation
  workflow_dispatch:

jobs:
  build-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure node-gyp Python
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          "PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "npm_config_python=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify installed sqlite3 N-API binary
        run: node -e "const s=require('sqlite3'); console.log('sqlite3 runtime OK', s.VERSION || 'loaded')"
      - name: Candidate validation
        run: |
          npm run sync-version
          node scripts/check-runtime-syntax.js
          node scripts/check-beta55-restaurant-acceptance.js
          node scripts/check-beta56-runtime-snapshot-consumer.js
          node scripts/check-offline-auth-authoritative-order.js
          node scripts/check-beta55-5-runtime-hardening.js
          node scripts/check-version.js
          node scripts/check-orders-performance-date-window.js
          node scripts/check-orders-runtime-corrective.js
      - name: Build Windows x64 installer without redundant native rebuild
        run: npx electron-builder --win nsis --x64 --config.npmRebuild=false --publish never
      - name: Upload SH-0007 sandbox installer
        uses: actions/upload-artifact@v4
        with:
          name: sharawla-pos-10.5.4-beta.58.1-orders-runtime-corrective-sh0007-x64
          path: dist/Sharawla-POS-Setup-10.5.4-beta.58.1.exe
          if-no-files-found: error
          retention-days: 7
