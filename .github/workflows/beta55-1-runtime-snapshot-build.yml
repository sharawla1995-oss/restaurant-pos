name: Beta55.1 Runtime Snapshot Sandbox Build

on:
  push:
    branches:
      - beta56-runtime-snapshot-consumer
  workflow_dispatch:

jobs:
  build-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure node-gyp Python
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          "PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "npm_config_python=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "npm_config_openssl_fips=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Candidate validation
        run: |
          npm run sync-version
          node scripts/check-runtime-syntax.js
          node scripts/check-beta55-restaurant-acceptance.js
          node scripts/check-beta56-runtime-snapshot-consumer.js
          node scripts/check-version.js
      - name: Build Windows x64 installer
        run: npx electron-builder --win nsis --x64
      - name: Upload SH-0007 sandbox installer
        uses: actions/upload-artifact@v4
        with:
          name: sharawla-pos-10.5.4-beta.55.1-sh0007-x64
          path: dist/*x64*.exe
          if-no-files-found: error
          retention-days: 7
