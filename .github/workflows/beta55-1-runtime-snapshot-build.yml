name: Beta58.4 SH-0007 Online Orders Acceptance Build

on:
  push:
    branches:
      - beta56-runtime-snapshot-consumer
      - beta56-offline-ownership-consolidation
  workflow_dispatch:

jobs:
  build-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure node-gyp Python
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          "PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "npm_config_python=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify installed sqlite3 N-API binary
        run: node -e "const s=require('sqlite3'); console.log('sqlite3 runtime OK', s.VERSION || 'loaded')"
      - name: Candidate validation
        run: |
          npm run sync-version
          node scripts/check-runtime-syntax.js
          node scripts/check-beta58-27-nav-foreach.js
          node scripts/check-beta55-restaurant-acceptance.js
          node scripts/check-beta56-runtime-snapshot-consumer.js
          node scripts/check-offline-auth-authoritative-order.js
          node scripts/check-beta45-offline-v2-transport.js
          node scripts/check-beta45-offline-v2-diagnostics.js
          node scripts/check-beta55-5-runtime-hardening.js
          node scripts/check-version.js
          node scripts/check-orders-performance-date-window.js
          node scripts/check-orders-runtime-corrective.js
          node scripts/check-inventory-overview-v1.js
          node scripts/check-touch-customer-v1.js
          node scripts/check-pos-profile-routing-v1.js
          node scripts/check-settings-hub-v1.js
          node scripts/check-kitchen-labels-plan-v1.js
          node scripts/check-shared-inventory-purchasing-routing-v1.js
          node scripts/check-restaurant-acceptance-stage-v1.js
          node scripts/check-point4-secure-uuid-v4.js
          node scripts/check-beta58-26-restaurant-point4-canonical-tx.js
          node scripts/check-offline-runtime-acceptance-coverage.js
          node scripts/check-offline-shift-lifecycle-acceptance.js
          node scripts/check-offline-http503-recovery-acceptance.js
          node scripts/check-runtime-snapshot-anti-rollback-runtime-acceptance.js
          node scripts/check-cross-profile-offline-commerce-scope.js
          node scripts/check-point15-focused-acceptance-runner.js
          node scripts/check-offline-customer-delivery-owner-design.js
      - name: Build Windows x64 installer without redundant native rebuild
        run: npx electron-builder --win nsis --x64 --config.npmRebuild=false --publish never
      - name: Verify packaged app.asar renderer ownership
        shell: pwsh
        run: |
          $asar = Join-Path $PWD 'dist\win-unpacked\resources\app.asar'
          if (!(Test-Path $asar)) { throw "packaged app.asar missing: $asar" }
          $probe = Join-Path $env:RUNNER_TEMP 'sharawla-app-asar-probe'
          if (Test-Path $probe) { Remove-Item $probe -Recurse -Force }
          New-Item -ItemType Directory -Path $probe | Out-Null
          npx asar extract $asar $probe
          $pkg = Get-Content (Join-Path $probe 'package.json') -Raw | ConvertFrom-Json
          $versionPrefix = '10.5.4-beta.58.'
          if (!$pkg.version.StartsWith($versionPrefix)) { throw "packaged version format mismatch: $($pkg.version)" }
          $patchText = $pkg.version.Substring($versionPrefix.Length)
          $patchNumber = 0
          if (![int]::TryParse($patchText, [ref]$patchNumber)) { throw "packaged beta patch is not numeric: $($pkg.version)" }
          if ($patchNumber -lt 3) { throw "packaged version too old: $($pkg.version)" }
          if ($pkg.main -ne 'main-beta44.js') { throw "packaged main mismatch: $($pkg.main)" }
          $app = Get-Content (Join-Path $probe 'app.js') -Raw
          if (!$app.Contains('ORDERS-DATE-WINDOW-V58.3')) { throw 'packaged app.js missing V58.3 marker' }
          if (!$app.Contains('id="ordersFrom"') -or !$app.Contains('id="ordersTo"')) { throw 'packaged app.js missing Orders date controls' }
          $offline43 = Get-Content (Join-Path $probe 'beta43-offline-core.js') -Raw
          if (!$offline43.Contains('if(!base.renderOrders){try{renderOrders=renderOrders43}catch{};try{global.renderOrders=renderOrders43}catch{}}')) { throw 'packaged Beta43 Orders fallback guard missing' }
          if ($offline43.Contains("`n  try{renderOrders=renderOrders43}catch{};try{global.renderOrders=renderOrders43}catch{};")) { throw 'packaged Beta43 still overrides Orders renderer unconditionally' }
          $productMap = Join-Path $probe 'product-map-navigation-v1.js'
          $navRegistry = Join-Path $probe 'sharawla-navigation-registry.js'
          $index = Join-Path $probe 'index.html'
          $inventoryOverview = Join-Path $probe 'inventory-overview-v1.js'
          $touchCss = Join-Path $probe 'touch-ux-v1.css'
          $settingsHubCss = Join-Path $probe 'settings-hub-v1.css'
          $point4Uuid = Join-Path $probe 'point4-uuid-v4.js'
          if (!(Test-Path $productMap)) { throw 'packaged Product Map runtime missing' }
          if (!(Test-Path $navRegistry)) { throw 'packaged Navigation Registry metadata missing' }
          if (!(Test-Path $index)) { throw 'packaged index.html missing' }
          if (!(Test-Path $inventoryOverview)) { throw 'packaged Inventory Overview runtime missing' }
          if (!(Test-Path $touchCss)) { throw 'packaged Touch UX stylesheet missing' }
          if (!(Test-Path $settingsHubCss)) { throw 'packaged Settings Hub stylesheet missing' }
          if (!(Test-Path $point4Uuid)) { throw 'packaged Point4 UUID provider missing' }
          $productMapText = Get-Content $productMap -Raw
          $navRegistryText = Get-Content $navRegistry -Raw
          $indexText = Get-Content $index -Raw
          $inventoryOverviewText = Get-Content $inventoryOverview -Raw
          $touchCssText = Get-Content $touchCss -Raw
          $settingsHubCssText = Get-Content $settingsHubCss -Raw
          $point4UuidText = Get-Content $point4Uuid -Raw
          if (!$productMapText.Contains('1.1.1-profile-aware-product-map')) { throw 'packaged Product Map profile-aware marker missing' }
          if (!$productMapText.Contains("restaurant:'تشغيل المطعم'")) { throw 'packaged Restaurant Product Map label missing' }
          if (!$productMapText.Contains("pharmacy:'تشغيل الصيدلية'")) { throw 'packaged Pharmacy profile-aware label missing' }
          if (!$productMapText.Contains("retail:'تشغيل المتجر'")) { throw 'packaged Retail profile-aware label missing' }
          if (!$productMapText.Contains("onlineOrders:'online-orders'")) { throw 'packaged Online Orders section mapping missing' }
          if (!$productMapText.Contains("foodOperations:'inventory-purchasing'")) { throw 'packaged Food Operations inventory grouping missing' }
          if (!$productMapText.Contains('Presentation-only grouping layer. It MUST NOT dispatch routes or change permissions.')) { throw 'packaged Product Map presentation-only marker missing' }
          if (!$productMapText.Contains('REGISTRY_MISSING')) { throw 'packaged Product Map fail-closed registry guard missing' }
          if (!$navRegistryText.Contains("routeKey:'orders'")) { throw 'packaged Navigation Registry missing Orders route' }
          $registryRef = "sharawla-navigation-registry.js?v=$($pkg.version)"
          $productMapRef = "product-map-navigation-v1.js?v=$($pkg.version)"
          $inventoryOverviewRef = "inventory-overview-v1.js?v=$($pkg.version)"
          if (!$indexText.Contains($registryRef)) { throw "packaged index missing versioned Navigation Registry reference: $registryRef" }
          if (!$indexText.Contains($productMapRef)) { throw "packaged index missing versioned Product Map reference: $productMapRef" }
          if (!$indexText.Contains($inventoryOverviewRef)) { throw "packaged index missing versioned Inventory Overview reference: $inventoryOverviewRef" }
          if ($indexText.IndexOf($registryRef) -gt $indexText.IndexOf($productMapRef)) { throw 'packaged Product Map loads before Navigation Registry metadata' }
          if (!$inventoryOverviewText.Contains('1.0.0-core-profile-aware')) { throw 'packaged Inventory Overview marker missing' }
          if (!$inventoryOverviewText.Contains('CORE_PROFILE_AWARE_READ_ONLY')) { throw 'packaged Inventory Overview read-only marker missing' }
          if (!$inventoryOverviewText.Contains('PROFILE_ADAPTER_MISSING')) { throw 'packaged Inventory Overview fail-closed profile guard missing' }
          if (!$app.Contains('INVENTORY-OVERVIEW-V1-CORE-DELEGATE')) { throw 'packaged app.js missing Inventory Overview delegate' }
          if (!$app.Contains('CUSTOMERS-MANUAL-CREATE-V1')) { throw 'packaged app.js missing manual customer create marker' }
          if (!$app.Contains('id="newCustomerBtn"')) { throw 'packaged app.js missing new customer button' }
          if (!$app.Contains('POS-PROFILE-ROUTING-V1')) { throw 'packaged explicit POS profile routing marker missing' }
          if (!$app.Contains("if(profile==='restaurant')return renderRestaurantPOS()")) { throw 'packaged Restaurant POS adapter missing' }
          if (!$app.Contains("if(profile==='retail')return renderRetailPOS()")) { throw 'packaged Retail POS adapter missing' }
          if (!$app.Contains('data-pos-profile-fail-closed="PROFILE_NOT_POS"')) { throw 'packaged non-POS fail-closed guard missing' }
          if (!$app.Contains("status:['delivery','pickup'].includes(orderType)?'new':'completed'")) { throw 'packaged Pickup lifecycle gate missing' }
          if (!$point4UuidText.Contains('1.0.0-secure-fallback')) { throw 'packaged Point4 UUID secure fallback marker missing' }
          if (!$point4UuidText.Contains("mode:'WEB_CRYPTO_SECURE_ONLY'")) { throw 'packaged Point4 UUID secure-only marker missing' }
          if ($point4UuidText.Contains('Math.random') -or $point4UuidText.Contains('Date.now')) { throw 'packaged Point4 UUID contains insecure fallback' }
          $nativeStoreText = Get-Content (Join-Path $probe 'beta45-offline-v2-native-store.js') -Raw
          $transportRuntimeText = Get-Content (Join-Path $probe 'beta45-offline-v2-transport-runtime.js') -Raw
          $customerDeliveryAcceptanceText = Get-Content (Join-Path $probe 'owner-acceptance-offline-customer-delivery-v58.js') -Raw
          $coreOpsAcceptanceText = Get-Content (Join-Path $probe 'owner-acceptance-offline-core-ops-v58.js') -Raw
          foreach ($marker in @('offline_customer_create_v1','offline_customer_update_v1','offline_customer_address_save_v1','offline_customer_address_delete_v1','offline_delivery_assign_driver_v1')) {
            if (!$nativeStoreText.Contains($marker)) { throw "packaged native-store missing fail-closed binding: $marker" }
            if (!$transportRuntimeText.Contains($marker)) { throw "packaged transport runtime missing binding: $marker" }
          }
          foreach ($testId in @('offline.customer-create-runtime-e2e','offline.customer-dependent-address-runtime-e2e','offline.customer-mutations-runtime-e2e','offline.delivery-driver-runtime-e2e','offline.delivery-economic-runtime-e2e')) {
            if (!$customerDeliveryAcceptanceText.Contains($testId)) { throw "packaged customer/delivery acceptance missing: $testId" }
          }
          foreach ($testId in @('offline.expense-runtime-e2e','offline.return-runtime-e2e')) {
            if (!$coreOpsAcceptanceText.Contains($testId)) { throw "packaged core offline acceptance missing: $testId" }
          }
          if (!$app.Contains('window.__SharawlaPoint4UuidV4')) { throw 'packaged app.js missing Point4 UUID provider delegation' }
          if (!$app.Contains('data-settings-hub-v1="1"')) { throw 'packaged Settings Hub marker missing' }
          if (!$app.Contains('تفعيل تشغيل المطبخ')) { throw 'packaged app.js missing explicit Kitchen operational label' }
          $restaurantEngineText = Get-Content (Join-Path $probe 'restaurant-engine.js') -Raw
          if (!$restaurantEngineText.Contains('الوصول إلى شاشة المطبخ')) { throw 'packaged Restaurant engine missing explicit Kitchen permission label' }
          if (!$app.Contains('SHARED-INVENTORY-PURCHASING-ROUTER-V1')) { throw 'packaged app.js missing shared inventory/purchasing Core router' }
          if (!$app.Contains('data-shared-inventory-route-fail-closed')) { throw 'packaged shared-route fail-closed guard missing' }
          $restaurantClosureText = Get-Content (Join-Path $probe 'beta55-restaurant-closure-ui.js') -Raw
          if (!$restaurantClosureText.Contains("const PAGES=new Set(['foodIngredients','foodRecipes','foodOperations','tables'])")) { throw 'packaged Restaurant capture still owns shared inventory routes' }
          if (!$restaurantClosureText.Contains('renderSharedRoute')) { throw 'packaged Restaurant shared adapter API missing' }
          if (!$navRegistryText.Contains("renderer:'renderSharedInventoryPurchasingRoute'")) { throw 'packaged Navigation Registry missing shared Core route owner' }
          $restaurantAcceptanceText = Get-Content (Join-Path $probe 'owner-acceptance-beta55-restaurant-v55.js') -Raw
          if (!$restaurantAcceptanceText.Contains('[restaurant-full-roundtrip:${stage}]')) { throw 'packaged Restaurant acceptance stage diagnostics missing' }
          if (!$restaurantAcceptanceText.Contains("const saleTx=point4Uuid(),saleDocumentUid=point4Uuid()")) { throw 'packaged Restaurant acceptance sale TX is not canonical UUIDv4' }
          if (!$restaurantAcceptanceText.Contains("const returnTx=point4Uuid(),returnDocumentUid=point4Uuid()")) { throw 'packaged Restaurant acceptance return TX is not canonical UUIDv4' }
          if (!$settingsHubCssText.Contains('.settings-hub-tabs')) { throw 'packaged Settings Hub tab CSS missing' }
          $settingsHubRef = "settings-hub-v1.css?v=$($pkg.version)"
          if (!$indexText.Contains($settingsHubRef)) { throw "packaged index missing versioned Settings Hub reference: $settingsHubRef" }
          if (!$touchCssText.Contains('@media (any-pointer: coarse)')) { throw 'packaged Touch UX coarse-pointer gate missing' }
          if (!$touchCssText.Contains('--sharawla-touch-target:46px')) { throw 'packaged Touch UX target size marker missing' }
          $point4UuidRef = "point4-uuid-v4.js?v=$($pkg.version)"
          if (!$indexText.Contains($point4UuidRef)) { throw "packaged index missing versioned Point4 UUID reference: $point4UuidRef" }
          if ($indexText.IndexOf($point4UuidRef) -gt $indexText.IndexOf('app.js?v=')) { throw 'packaged Point4 UUID provider loads after app.js' }
          $touchRef = "touch-ux-v1.css?v=$($pkg.version)"
          if (!$indexText.Contains($touchRef)) { throw "packaged index missing versioned Touch UX reference: $touchRef" }
          $main = Get-Content (Join-Path $probe 'main.js') -Raw
          if (!$main.Contains("loadFile('index.html')")) { throw 'packaged main.js does not load index.html' }
          if (!$main.Contains('clearDesktopRendererAssetCaches')) { throw 'packaged main.js missing desktop renderer cache cleanup' }
          Write-Host "PACKAGED APP.ASAR OWNERSHIP PASS version=$($pkg.version) main=$($pkg.main)"
      - name: Upload SH-0007 sandbox installer
        uses: actions/upload-artifact@v4
        with:
          name: sharawla-pos-${{ github.sha }}-sh0007-x64
          path: dist/Sharawla-POS-Setup-*.exe
          if-no-files-found: error
          retention-days: 7
