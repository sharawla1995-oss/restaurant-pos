name: V10.5.13 Production Prep Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: windows-2022
    steps:
      - name: Checkout certified 10.5.13 candidate
        uses: actions/checkout@v4
        with:
          ref: 54490d9ae1c8ca7de0cf20b852d77b97d326c7a7
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install

      - name: Run certified source checks
        run: npm run check

      - name: Build Windows x64
        run: npm run dist -- --win --x64 --publish never

      - name: Build Windows ia32
        run: npm run dist -- --win --ia32 --publish never
