name: Point4 Batch1 Token Semantic Proof
on:
  push:
    branches: [beta56-offline-ownership-consolidation]
    paths: ['.github/workflows/point4-batch1-token-semantic-proof.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres
      SOURCE: supabase-beta55-acceptance-supply.sql
      EXPECTED_BLOB: fae66e56925c53b73e82c5eb016a9d40c33058cc
    steps:
      - uses: actions/checkout@v4
      - name: Verify accepted blob
        run: test "$(git hash-object "$SOURCE")" = "$EXPECTED_BLOB"
      - name: Extract and execute accepted definitions
        shell: python
        run: |
          import re,pathlib
          s=pathlib.Path("supabase-beta55-acceptance-supply.sql").read_text()
          ns=["sharawla_beta55_supply_acceptance_cleanup_v1","sharawla_beta55_supply_acceptance_fixture_v1"]
          out=[]
          for n in ns:
            m=re.search(r"create\s+or\s+replace\s+function\s+public\."+re.escape(n)+r"\s*\(.*?\bend\$\$\s*;",s,re.I|re.S)
            if not m: raise SystemExit("missing="+n)
            out.append(m.group(0))
          pathlib.Path("/tmp/accepted.sql").write_text("\n".join(out))
      - run: psql -v ON_ERROR_STOP=1 -f /tmp/accepted.sql
      - name: Export isolated effective definitions
        run: |
          psql -At -c "select pg_get_functiondef('public.sharawla_beta55_supply_acceptance_cleanup_v1(text)'::regprocedure)" > /tmp/isolated39.def
          psql -At -c "select pg_get_functiondef('public.sharawla_beta55_supply_acceptance_fixture_v1(text)'::regprocedure)" > /tmp/isolated40.def
      - name: Produce source-side token evidence
        shell: python
        run: |
          import hashlib,json,pathlib
          def normalize(s):
            out=[];i=0;n=len(s);state="normal"
            while i<n:
              if state=="normal":
                if s.startswith("--",i): state="linecomment";i+=2;continue
                if s.startswith("/*",i): state="blockcomment";i+=2;continue
                if s[i]=="'": state="single";out.append(s[i]);i+=1;continue
                if s.startswith("$function$",i): state="dollar";out.append("$function$");i+=10;continue
                if s[i].isspace(): i+=1;continue
                out.append(s[i]);i+=1
              elif state=="linecomment":
                if s[i] in "\r\n": state="normal"
                i+=1
              elif state=="blockcomment":
                if s.startswith("*/",i): state="normal";i+=2
                else:i+=1
              elif state=="single":
                out.append(s[i])
                if s[i]=="'":
                  if i+1<n and s[i+1]=="'": out.append("'");i+=2;continue
                  state="normal"
                i+=1
              elif state=="dollar":
                if s.startswith("$function$",i): out.append("$function$");i+=10;state="normal"
                else: out.append(s[i]);i+=1
            return "".join(out)
          ev={}
          for cid in ("39","40"):
            raw=pathlib.Path("/tmp/isolated"+cid+".def").read_text()
            norm=normalize(raw)
            ev[cid]={"normalized_sha256":hashlib.sha256(norm.encode()).hexdigest(),"normalized_length":len(norm),"normalized":norm}
          pathlib.Path("/tmp/source-token-evidence.json").write_text(json.dumps(ev,ensure_ascii=False,indent=2))
          print(json.dumps({k:{x:v[x] for x in ("normalized_sha256","normalized_length")} for k,v in ev.items()},indent=2))
