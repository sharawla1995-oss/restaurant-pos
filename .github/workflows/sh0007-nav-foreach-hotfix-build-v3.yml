name: SH-0007 Navigation forEach Hotfix Build V3

on:
  push:
    branches:
      - nav-registry-1d-b-foreach-hotfix-sh0007-build-v3

permissions:
  contents: read

jobs:
  build-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3fa651472a309e5e5539982fbedcdfd704de2c54
          fetch-depth: 1

      - name: Verify exact candidate
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          Write-Host "HEAD=$actual"
          if ($actual -ne "3fa651472a309e5e5539982fbedcdfd704de2c54") { throw "candidate mismatch: $actual" }

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure node-gyp Python
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          "PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "npm_config_python=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Sync version
        run: npm run sync-version

      - name: Safety gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/check-navigation-profile-leakage-corrective.js
          node scripts/check-runtime-syntax.js
          node scripts/check-unified-navigation-registry-1c.js
          node scripts/check-unified-navigation-registry-1d-a.js
          node scripts/check-unified-navigation-registry-1d-b-runtime-binding.js
          node scripts/check-beta55-restaurant-acceptance.js
          node scripts/check-orders-performance-date-window.js
          node scripts/check-orders-runtime-corrective.js

      - name: Build Windows x64 installer
        run: npx electron-builder --win nsis --x64 --config.npmRebuild=false --publish never

      - name: Verify packaged hotfix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asar = Join-Path $PWD 'dist\win-unpacked\resources\app.asar'
          if (!(Test-Path $asar)) { throw "packaged app.asar missing" }

          $probe = Join-Path $env:RUNNER_TEMP 'sharawla-nav-foreach-hotfix-v3-asar'
          if (Test-Path $probe) { Remove-Item $probe -Recurse -Force }
          New-Item -ItemType Directory -Path $probe | Out-Null
          npx asar extract $asar $probe
          if ($LASTEXITCODE -ne 0) { throw "asar extract failed" }

          $pkg = Get-Content (Join-Path $probe 'package.json') -Raw | ConvertFrom-Json
          if ($pkg.version -ne '10.5.4-beta.58.3') { throw "version mismatch: $($pkg.version)" }

          $app = Get-Content (Join-Path $probe 'app.js') -Raw
          $goodIter = '$$(' + "'#nav button[data-page]'" + ').forEach'
          if (!$app.Contains($goodIter)) { throw "NodeList navigation iteration hotfix missing" }
          if (!$app.Contains("function applyProfileNavigationLabels(){")) { throw "profile label function missing" }
          if (!$app.Contains("stockCount:'🧮 جرد الخامات'")) { throw "restaurant stockCount label missing" }
          if (!$app.Contains("transfers:'🔄 تحويلات الخامات'")) { throw "restaurant transfers label missing" }
          if (!$app.Contains("purchasing:'📥 مشتريات الخامات'")) { throw "restaurant purchasing label missing" }
          if (!$app.Contains("ORDERS-DATE-WINDOW-V58.3")) { throw "Orders V58.3 marker missing" }

          $index = Get-Content (Join-Path $probe 'index.html') -Raw
          if (!$index.Contains('<button data-page="marketSettings" class="hidden">')) { throw 'marketSettings default hidden missing' }
          if (!$index.Contains('<button data-page="retailOffers" class="hidden">')) { throw 'retailOffers default hidden missing' }

          Write-Host "PACKAGED NAV FOREACH HOTFIX V3 PASS version=$($pkg.version)"

      - name: Upload SH-0007 installer
        uses: actions/upload-artifact@v4
        with:
          name: sharawla-pos-10.5.4-beta.58.3-nav-foreach-hotfix-v3-1db-sh0007-x64
          path: dist/Sharawla-POS-Setup-10.5.4-beta.58.3*.exe
          if-no-files-found: error
          retention-days: 7
