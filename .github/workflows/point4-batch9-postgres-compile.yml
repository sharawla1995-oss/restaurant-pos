name: Point4 Batch9 Supply Cleanup Semantic and PostgreSQL Compile Gate
on:
  push:
    branches: [ beta56-offline-ownership-consolidation ]
    paths:
      - 'supabase-beta55-acceptance-supply.sql'
      - 'scripts/check-point4-batch9-supply-cleanup.js'
      - '.github/workflows/point4-batch9-postgres-compile.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - name: Assert isolation
        run: echo "No Supabase/Beta/Production credentials are used by this workflow."
      - name: Semantic
        run: node scripts/check-point4-batch9-supply-cleanup.js
      - name: Build compile stubs
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create schema auth;
          create function auth.uid() returns uuid language sql as $$select '00000000-0000-0000-0000-000000000001'::uuid$$;
          create function public.is_admin() returns boolean language sql as $$select true$$;
          create function public.inventory_stock_assert_legacy_write_allowed_v2(bigint,text,bigint) returns void language plpgsql as $$begin return; end$$;
          create table public.branches(id bigint,location_code text);
          create table public.products(id bigint,barcode text);
          create table public.retail_inventory_balances(branch_id bigint,product_id bigint);
          create table public.audit_logs(branch_id bigint,details jsonb,entity_type text,entity_id bigint);
          create table public.inventory_supply_requests(id bigint,client_tx_id text,source_location_id bigint,destination_branch_id bigint);
          create table public.retail_inventory_movements(branch_id bigint,client_tx_id text);
          create table public.inventory_supply_receipts(request_id bigint);
          create table public.inventory_supply_routes(id bigint,source_location_id bigint,destination_branch_id bigint);
          create table public.inventory_supply_catalog(route_id bigint);
          create table public.retail_reorder_rules(product_id bigint);
          SQL
      - name: Compile cleanup
        run: |
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('supabase-beta55-acceptance-supply.sql').read_text()
          m=re.search(r'(?is)(create or replace function\s+public\.sharawla_beta55_supply_acceptance_cleanup_v1\s*\(.*?end\s*\$\$;)',s)
          assert m, 'cleanup definition missing'
          pathlib.Path('/tmp/b9.sql').write_text(m.group(1))
          print('EXTRACT_COMPLETE functions=1')
          PY
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/b9.sql
          echo "POSTGRES_CREATE_PASS functions=1"
      - name: Verify effective definition
        run: |
          test "$(psql -h localhost -U postgres -d postgres -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='sharawla_beta55_supply_acceptance_cleanup_v1'")" = "1"
          echo "PG_FUNCTIONS_EXIST=1"
