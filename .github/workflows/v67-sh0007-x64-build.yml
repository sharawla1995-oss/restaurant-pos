name: V67 SH-0007 x64 Candidate Build

on:
  push:
    branches:
      - build/v67-sh0007-x64-candidate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v67-sh0007-x64-candidate
  cancel-in-progress: false

jobs:
  build-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '16'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify V67 branch and fixed version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -ne 'build/v67-sh0007-x64-candidate') { throw "Wrong branch: $env:GITHUB_REF_NAME" }
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $ver = Get-Content version.json -Raw | ConvertFrom-Json
          if ([string]$pkg.version -ne '10.5.4-beta.58.32') { throw "Wrong package version" }
          if ([string]$ver.version -ne [string]$pkg.version) { throw "Version mismatch" }

      - name: Verify exact V67 Git blob overlay
        shell: pwsh
        run: |
          $expected = @{
            'app.js'='c65e99c9c35c763ca4ea4ab0daf53b5df6066785'
            'beta45-offline-v2-inbox-runtime.js'='11d2f0c167ad07d4a69031d4b96e6699ad42e21f'
            'beta45-offline-v2-inbox-store.js'='68cc7508c09151f9d6a5cb7b7287b0f56169dd62'
            'beta45-offline-v2-native-store.js'='e84ecb9e4b2277fbc797fa880d580fa107ef70a9'
            'beta45-offline-v2-sync.js'='3ff39b0119dc4112731566caf56a413e6df372c6'
            'beta45-offline-v2-transport-runtime.js'='6d81cc6232568797633442579b919559b77858ef'
            'beta55-delivery-settlement-shift-cash.js'='6d052aaff3835a55ee311eac17de8412d690d182'
            'beta55-restaurant-closure-ui.js'='a0b0bc6459a5db6bad206437ad831c696b3d3f44'
            'food-advanced-ui-v1.js'='6be999fdd94e6e6286dd3c1b2c902f3f22e4dd4f'
            'food-recipe-ui-v1.js'='3d2d7b8aaadedb16b96a291894a01270201c6760'
            'permissions-v2-customers-create-routing.js'='a30867d03c49193a28fc4dc182823aaaa68c65fb'
            'permissions-v2-customers-edit-address-routing.js'='d960270792fedff2a7edc227f383755fe05a7fff'
            'permissions-v2-delivery-settings-routing.js'='fbf107f58abcf0c5fa63bc97e52f5bcf08987239'
            'permissions-v2-expense-edit-routing.js'='1fa84971e6ae0e33eac1ab05c57d529abecb8eba'
            'permissions-v2-order-fulfillment-routing.js'='01120a7364ee40b04dcfc85262e6647f70ee9375'
            'scripts/batch1-runtime-evidence-contract.js'='845f7d70843939faa3e371d3fead3d54b32defc6'
            'scripts/check-batch1-continuation.js'='eaec9e6b4492ec3819d3a515e4c7591f1659aa87'
            'scripts/check-batch1-final-gaps.js'='48397cc20953cb46780dfd17f46d600287633b51'
            'scripts/check-batch1-final-postgres.py'='701abb50035826effca5d0965c16a45cd0edab6e'
            'scripts/check-batch1-final-review.js'='84c4852d6447f45a3b6bab06754a099bf16f2f82'
            'scripts/check-batch1-postgres.py'='8947391984dfccf88ce3b853c5d38df201e53ec0'
            'scripts/check-batch1-restaurant-families.js'='47eea5d073e0ccf450f4ccfd54cb2a98fcb53bed'
            'scripts/check-batch1-ui.js'='233e77f840200eb776e408e49a5ab253552c4e10'
            'scripts/check-bon-final-definition-chain.js'='a9455377abd3b4230daaa9e466329e49ad468e7d'
            'scripts/check-offline-closure-batch1.js'='ac371855df8013a08b08722168d69e5ca454a3ce'
            'scripts/check-offline-expense-local-projection.js'='1ab4056cdb668e76be86a247aa668d5c94f26345'
            'scripts/check-offline-pos-sale-native-owner.js'='962045c0e9820bd2453b43957830aaee5c85f315'
            'scripts/check-offline-reference-return-behavior.js'='065eee47ce58870ac9aaa6fff66680eaaff7411a'
            'scripts/check-rc1-runtime-alignment-final-dispatcher.js'='60fc6142e7c08dd438257dd08e6a72b0bf0c059e'
            'scripts/offline-reference-return-fixture.js'='cc1e6d76ca3d999e2596d5357a603d14cb46c86c'
            'scripts/offline-reference-return-sql-contract.js'='c7da166c21d792ff9d73ad15512ace0fe11defae'
            'shared-business-core-v1.js'='efec4d1b065bc2dbae70c15cea77eb064f6878b7'
            'supabase-offline-v2-expense-edit-source.sql'='8ce910f237547a2fb83445ceeb7e154e11fb1090'
            'supabase-rc1-bon-numbering-policy-v1-source.sql'='f5bbbcd6bb1af89e3ffb6d2802fb0b01e642a18b'
            'supabase-rc1-offline-v2-runtime-alignment-final-dispatcher.sql'='2f89df4c7c10f0654574b21953a99b964f4e1370'
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $actual = (git rev-parse "HEAD:$($entry.Key)").Trim()
            if ($LASTEXITCODE -ne 0) { throw "Missing V67 path: $($entry.Key)" }
            if ($actual -ne $entry.Value) { throw "V67 blob mismatch: $($entry.Key) expected=$($entry.Value) actual=$actual" }
          }
          if ($expected.Count -ne 35) { throw "Expected overlay count mismatch" }
          Write-Host "V67 Git blob overlay PASS 35/35"

      - name: Pin node-gyp Python
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          "PYTHON=$python" >> $env:GITHUB_ENV
          "npm_config_python=$python" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: npm install --ignore-scripts=false --no-audit --no-fund

      - name: Run full source and regression gates
        run: npm run check:ci

      - name: Build Windows x64 candidate
        run: npm run dist -- --win --x64 --publish never

      - name: Save V67 installer, SHA256 and provenance
        shell: pwsh
        run: |
          $version = '10.5.4-beta.58.32'
          $source = Get-ChildItem dist -Filter "Sharawla-POS-Setup-$version*.exe" | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $source) { throw "x64 installer not found" }
          $target = "Sharawla-POS-Setup-$version-V67-SH0007-x64.exe"
          Copy-Item $source.FullName $target -Force
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLower()
          "$target  $hash" | Set-Content v67-sh0007-sha256.txt -Encoding ascii
          @(
            "scope=SH-0007-only"
            "internal_version=$version"
            "v67_base=40511daacf42b8aed6201bd610f99f6d015d1a23"
            "build_branch=$env:GITHUB_REF_NAME"
            "build_commit=$env:GITHUB_SHA"
            "overlay_git_blobs=PASS-35-of-35"
            "supabase_contact=none"
            "production_target=none"
          ) | Set-Content v67-sh0007-build-provenance.txt -Encoding ascii

      - name: Upload V67 SH-0007 x64 candidate
        uses: actions/upload-artifact@v4
        with:
          name: sharawla-pos-10.5.4-beta.58.32-v67-sh0007-x64
          path: |
            Sharawla-POS-Setup-10.5.4-beta.58.32-V67-SH0007-x64.exe
            v67-sh0007-sha256.txt
            v67-sh0007-build-provenance.txt
          if-no-files-found: error
          retention-days: 7
