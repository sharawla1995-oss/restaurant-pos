name: Beta55 Delivery Settlement Validation

on:
  push:
    branches:
      - beta55-delivery-settlement-shift-cash-work
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gates:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '16'
      - name: JavaScript syntax gates
        run: |
          node --check beta55-delivery-settlement-shift-cash.js
          node --check owner-acceptance-beta55-delivery-settlement-v55.js
          node --check owner-acceptance-beta55-restaurant-compat-v55.js
          node --check beta36-integration-loader.js
          node --check owner-acceptance-lazy-loader-v47.js
      - name: Run full source and regression gates
        run: npm run check
