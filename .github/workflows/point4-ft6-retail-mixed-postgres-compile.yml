name: Point4 FT6 Retail Mixed Stock Semantic and PostgreSQL Compile Gate
on:
  push:
    branches: [ beta56-offline-ownership-consolidation ]
    paths:
      - 'supabase-point4-ft6-retail-mixed-stock.sql'
      - 'scripts/check-point4-ft6-retail-mixed-stock.js'
      - '.github/workflows/point4-ft6-retail-mixed-postgres-compile.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - name: Assert isolation
        run: echo "No Supabase/Beta/Production credentials are used by this workflow."
      - name: Semantic gate
        run: node scripts/check-point4-ft6-retail-mixed-stock.js
      - name: Build PostgreSQL 16 compile harness
        run: |
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('supabase-point4-ft6-retail-mixed-stock.sql').read_text()
          names=['retail_landed_cost_post_v1','retail_purchase_receive_v2','retail_supplier_return_create_v2']
          bodies=[]
          for name in names:
            m=re.search(r'(?is)(create or replace function\s+public\.'+re.escape(name)+r'\s*\(.*?end;\$\$;)',s)
            assert m, name+' missing'
            bodies.append(m.group(1))
          allbody='\n'.join(bodies)
          tables=sorted(set(re.findall(r'public\.([a-zA-Z_][a-zA-Z0-9_]*)',allbody)))
          funcs={'is_admin','has_permission','has_branch_access','current_employee_id','inventory_stock_assert_legacy_write_allowed_v2'}
          tables=[t for t in tables if t not in funcs and t not in names]
          # Deliberately broad typed stubs: compile PL/pgSQL names/types without any Sharawla/Supabase connection.
          defs={
           'retail_landed_costs':'id bigint,goods_receipt_id bigint,status text,updated_at timestamptz',
           'retail_goods_receipts':'id bigint,purchase_order_id bigint,branch_id bigint,supplier_id bigint,client_tx_id text,created_by_employee_id bigint,received_at timestamptz',
           'retail_landed_cost_allocations':'id bigint,landed_cost_id bigint,goods_receipt_item_id bigint,allocated_amount numeric',
           'retail_goods_receipt_items':'id bigint,goods_receipt_id bigint,purchase_order_item_id bigint,product_id bigint,variant_id bigint,quantity numeric,unit_cost numeric',
           'retail_variant_inventory_movements':'branch_id bigint,variant_id bigint,movement_type text,quantity_delta numeric,created_at timestamptz,balance_after numeric,unit_cost numeric,reference_type text,reference_id text,client_tx_id text,employee_id bigint',
           'retail_inventory_movements':'branch_id bigint,product_id bigint,movement_type text,quantity_delta numeric,created_at timestamptz,balance_after numeric,unit_cost numeric,reference_type text,reference_id text,client_tx_id text,employee_id bigint',
           'retail_variant_inventory_balances':'branch_id bigint,variant_id bigint,quantity numeric,average_unit_cost numeric,last_purchase_cost numeric,updated_at timestamptz',
           'retail_inventory_balances':'branch_id bigint,product_id bigint,quantity numeric,average_unit_cost numeric,last_purchase_cost numeric,updated_at timestamptz',
           'retail_inventory_value_adjustments_v1':'branch_id bigint,product_id bigint,variant_id bigint,landed_cost_id bigint,goods_receipt_item_id bigint,amount numeric,quantity_at_post numeric,old_average_unit_cost numeric,new_average_unit_cost numeric,employee_id bigint',
           'retail_purchase_workflow_events':'entity_type text,entity_id bigint,from_status text,to_status text,note text,employee_id bigint',
           'retail_purchase_orders':'id bigint,branch_id bigint,supplier_id bigint,status text,updated_at timestamptz',
           'retail_purchase_order_items':'id bigint,purchase_order_id bigint,product_id bigint,variant_id bigint,quantity_ordered numeric,quantity_received numeric,unit_cost numeric',
           'retail_supplier_returns':'id bigint,branch_id bigint,supplier_id bigint,notes text,client_tx_id text,created_by_employee_id bigint',
           'retail_supplier_return_items':'supplier_return_id bigint,product_id bigint,variant_id bigint,quantity numeric,unit_cost numeric',
           'retail_suppliers':'id bigint,active boolean',
           'product_variants':'id bigint,product_id bigint,is_stock_unit boolean'
          }
          lines=["create schema auth;","create function auth.uid() returns uuid language sql as $$select '00000000-0000-0000-0000-000000000001'::uuid$$;",
           "create function public.is_admin() returns boolean language sql as $$select true$$;",
           "create function public.has_permission(text) returns boolean language sql as $$select true$$;",
           "create function public.has_branch_access(bigint) returns boolean language sql as $$select true$$;",
           "create function public.current_employee_id() returns bigint language sql as $$select 1::bigint$$;",
           "create function public.inventory_stock_assert_legacy_write_allowed_v2(bigint,text,bigint) returns void language plpgsql as $$begin return; end$$;"]
          for t in tables:
            assert t in defs, 'missing stub '+t
            lines.append('create table public.%s(%s);'%(t,defs[t]))
          pathlib.Path('/tmp/ft6-stubs.sql').write_text('\n'.join(lines))
          pathlib.Path('/tmp/ft6.sql').write_text('\n\n'.join(bodies))
          print('EXTRACT_COMPLETE functions=3 tables='+str(len(tables)))
          PY
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/ft6-stubs.sql
      - name: PostgreSQL 16 compile
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/ft6.sql
          echo "POSTGRES_CREATE_PASS functions=3"
      - name: Effective definition read-back
        run: |
          test "$(psql -h localhost -U postgres -d postgres -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('retail_landed_cost_post_v1','retail_purchase_receive_v2','retail_supplier_return_create_v2')")" = "3"
          for fn in retail_landed_cost_post_v1 retail_purchase_receive_v2 retail_supplier_return_create_v2; do
            psql -h localhost -U postgres -d postgres -Atc "select pg_get_functiondef(p.oid) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='$fn'" > "/tmp/$fn.effective.sql"
            grep -q "inventory_stock_assert_legacy_write_allowed_v2" "/tmp/$fn.effective.sql"
            grep -q "v_frozen_items" "/tmp/$fn.effective.sql"
          done
          echo "PG_GET_FUNCTIONDEF_PASS functions=3 guards=3 frozen_sets=3"
