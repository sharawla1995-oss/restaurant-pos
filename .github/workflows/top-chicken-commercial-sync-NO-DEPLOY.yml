name: Top Chicken Central-to-Beta Bridge - SOURCE ONLY / NO DEPLOY
on:
  push:
    branches: [codex/top-chicken-sh0008-rc9-prelaunch-no-deploy]
    paths:
      - 'supabase/functions/top-chicken-entitlement-bridge/**'
      - 'supabase/functions/top-chicken-commercial-proof/**'
      - 'supabase/functions/top-chicken-commercial-sync/**'
      - 'review-only/top-chicken-commercial-lease-bridge-NO-DEPLOY.sql'
      - 'tests/top-chicken/central-five-feature-lease.mjs'
      - 'tests/top-chicken/central-signed-bridge-scope.mjs'
      - 'tests/top-chicken/commercial-operator-refresh.cjs'
      - 'tests/top-chicken/commercial-lease-pg17-*.sql'
      - '.github/workflows/top-chicken-commercial-sync-NO-DEPLOY.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Central decision and HMAC helpers syntax
        run: |
          node --check supabase/functions/top-chicken-entitlement-bridge/central-decision.mjs
          node --check supabase/functions/top-chicken-entitlement-bridge/hmac.mjs
      - name: Exact five-feature positive negative entitlement proofs
        run: node tests/top-chicken/central-five-feature-lease.mjs
      - name: HMAC verification and scope/static SQL guards
        run: node tests/top-chicken/central-signed-bridge-scope.mjs
      - name: Scoped Beta operator and POS lease refresh static checks
        run: node tests/top-chicken/commercial-operator-refresh.cjs
      - name: No deployment statement
        run: echo 'DO NOT apply SQL, deploy Central/Beta Edge, sync grants, reset devices, or change tenants.'
  isolated-postgres17:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      pg17:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: tc_isolated
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tc_isolated"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: local_test_only
      PGDATABASE: tc_isolated
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 17 isolated schema and roles
        run: psql -X -v ON_ERROR_STOP=1 -f tests/top-chicken/commercial-lease-pg17-fixture.sql
      - name: Apply candidate only to synthetic isolated PG17
        run: psql -X -v ON_ERROR_STOP=1 -f review-only/top-chicken-commercial-lease-bridge-NO-DEPLOY.sql
      - name: Verify proof, failure and cross-tenant invariants
        run: psql -X -v ON_ERROR_STOP=1 -f tests/top-chicken/commercial-lease-pg17-assertions.sql
