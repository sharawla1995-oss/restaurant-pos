name: Point4 Batch5 Semantic and PostgreSQL Compile Gate
on:
  push:
    branches: [ beta56-offline-ownership-consolidation ]
    paths:
      - 'supabase-point4-pre-cutover-46-guard-installation-batch5-website-legacy-core.sql'
      - 'scripts/check-point4-batch5-website-legacy-core.js'
      - '.github/workflows/point4-batch5-postgres-compile.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - name: Assert isolation
        run: echo "No Supabase/Beta/Production credentials are used by this workflow."
      - name: Run semantic checker
        run: node scripts/check-point4-batch5-website-legacy-core.js
      - name: Install compile stubs
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create table public.retail_website_orders(id bigint,public_order_code text,branch_id bigint,idempotency_key text,reservation_key text,customer_name text,customer_phone text,customer_address text,customer_notes text,order_type text,delivery_zone_id bigint,payment_method_code text,payment_status text,payment_reference text,subtotal numeric,offer_discount numeric,delivery_fee numeric,total numeric,status text,reservation_expires_at timestamptz,created_at timestamptz);
          create table public.retail_website_order_items(retail_website_order_id bigint,product_id bigint,product_name text,unit_type text,quantity numeric,unit_price numeric,unit_cost_snapshot numeric,line_subtotal numeric,offer_discount numeric,line_total numeric,notes text);
          create table public.retail_stock_reservations(branch_id bigint,product_id bigint,quantity numeric,reservation_key text,status text,expires_at timestamptz,website_order_id bigint);
          create unique index on public.retail_stock_reservations(reservation_key,product_id);
          create table public.products(id bigint,active boolean,name text,price numeric,cost numeric);
          create table public.retail_product_settings(product_id bigint,unit_type text,allow_decimal boolean,qty_step numeric,min_qty numeric,online_enabled boolean);
          create table public.retail_inventory_balances(branch_id bigint,product_id bigint,quantity numeric,track_inventory boolean);
          create unique index on public.retail_inventory_balances(branch_id,product_id);
          create table public.branch_products(branch_id bigint,product_id bigint,active boolean,website_paused_until timestamptz,price_override numeric);
          create table public.payment_methods(id bigint,code text,active boolean);
          create table public.branch_payment_methods(payment_method_id bigint,branch_id bigint,active boolean,website_enabled boolean);
          create table public.delivery_zones(id bigint,branch_id bigint,active boolean,delivery_fee numeric);
          create function public.retail_website_normalize_phone(text) returns text language sql as $$select $1$$;
          create function public.retail_website_branch_open(bigint) returns boolean language sql as $$select true$$;
          create function public.retail_website_offer_discount(bigint,bigint,numeric,numeric) returns numeric language sql as $$select 0::numeric$$;
          create function public.inventory_stock_assert_legacy_write_allowed_v2(bigint,text,bigint) returns void language plpgsql as $$begin return; end$$;
          SQL
      - name: Extract and compile core definition
        run: |
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('supabase-point4-pre-cutover-46-guard-installation-batch5-website-legacy-core.sql').read_text()
          m=re.search(r'(?is)(create or replace function\s+public\.retail_create_website_order_beta18_core\s*\(.*?end\s*\$\$;)',s)
          assert m, 'core definition not found'
          assert len(re.findall(r'(?im)^create or replace function\s+',s))==1
          pathlib.Path('/tmp/b5.sql').write_text(m.group(1))
          print('EXTRACT_COMPLETE functions=1')
          PY
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/b5.sql
          echo "POSTGRES_CREATE_PASS functions=1"
      - name: Verify effective core definition
        run: |
          test "$(psql -h localhost -U postgres -d postgres -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='retail_create_website_order_beta18_core'")" = "1"
          echo "PG_FUNCTIONS_EXIST=1"
