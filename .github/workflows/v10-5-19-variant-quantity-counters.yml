name: V10.5.19 Variant Quantity Counters Gate
on:
  push:
    branches: [feature/v10.5.19-variant-quantity-counters]
  workflow_dispatch:
jobs:
  quantity-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node --check app.js
      - run: node --check top-burger-unified/app.js
      - name: Exact variant and modifier quantity contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          for(const f of ['app.js','top-burger-unified/app.js']){
            const s=fs.readFileSync(f,'utf8');
            for(const x of ['data-vplus','data-vminus','data-mplus','data-mminus','variant_id:i.variant_id||null','quantity:Number(md.quantity||1)','variantQty=new Map(),extrasByVariant=new Map()']) if(!s.includes(x)) throw new Error(f+' missing '+x);
          }
          console.log('VARIANT_AND_EXACT_MODIFIER_QUANTITY_PASS');
          NODE
